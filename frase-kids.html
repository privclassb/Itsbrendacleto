<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palavra do Dia | itsbrendacleto Kids</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --rose: #F9A8C9; --mint: #7ECBA1; --lavender: #C3B1E1; --yellow: #FFD97D; --sky: #90C9F9; --cream: #FFF8F0; --text: #3D2B1F; --white: #FFFFFF; --radius: 20px; }
    body { font-family: 'Nunito', sans-serif; background: var(--cream); min-height: 100vh; }
    header { background: var(--white); padding: 14px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .btn-back { background: var(--cream); border: 2px solid #EEE; border-radius: 12px; padding: 7px 14px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: var(--text); text-decoration: none; }
    .btn-back:hover { border-color: var(--rose); }
    .header-title { font-size: 16px; font-weight: 900; color: var(--text); }
    main { padding: 28px 20px; max-width: 500px; margin: 0 auto; }

    .word-card {
      background: linear-gradient(135deg, #FFD97D, #F9A8C9);
      border-radius: var(--radius);
      padding: 36px 24px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .word-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: rgba(61,43,31,0.6); margin-bottom: 8px; }
    .word-english { font-size: 48px; font-weight: 900; color: var(--text); margin-bottom: 6px; }
    .word-portuguese { font-size: 20px; font-weight: 700; color: rgba(61,43,31,0.7); margin-bottom: 20px; }
    .word-emoji { font-size: 48px; margin-bottom: 16px; display: block; }
    .btn-audio { background: rgba(255,255,255,0.5); border: none; border-radius: 14px; padding: 12px 24px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; color: var(--text); cursor: pointer; transition: all 0.2s; }
    .btn-audio:hover { background: rgba(255,255,255,0.7); }

    .example-card { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .example-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #AAA; margin-bottom: 10px; }
    .example-en { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .example-pt { font-size: 14px; font-weight: 600; color: #AAA; }

    .btn-next { width: 100%; padding: 16px; background: var(--lavender); border: none; border-radius: var(--radius); font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 900; color: var(--text); cursor: pointer; transition: all 0.2s; }
    .btn-next:hover { background: #B8A0D8; }

    .tip { background: #F0FFF7; border: 2px solid var(--mint); border-radius: var(--radius); padding: 14px 18px; font-size: 13px; font-weight: 700; color: var(--text); display: flex; gap: 10px; margin-bottom: 16px; }
  </style>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#5C4033" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="itsbrendacleto" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          setInterval(function () { reg.update(); }, 60000);
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update();
          });
        }).catch(function () {});
      });
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        var active = document.activeElement;
        var isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
        if (isTyping) {
          active.addEventListener('blur', function () { window.location.reload(); }, { once: true });
        } else {
          window.location.reload();
        }
      });
    }
  </script>
</head>
<body>

<header>
  <a href="home-kids.html" class="btn-back">← Voltar</a>
  <div class="header-title">💬 Palavra do dia</div>
</header>

<main>

  <div class="word-card">
    <div class="word-label">Palavra do dia</div>
    <span class="word-emoji" id="wordEmoji">😊</span>
    <div class="word-english" id="wordEn">Happy</div>
    <div class="word-portuguese" id="wordPt">Feliz</div>
    <button class="btn-audio" id="btnAudio">🔊 Ouvir pronúncia</button>
  </div>

  <div class="example-card">
    <div class="example-label">Exemplo de uso</div>
    <div class="example-en" id="exampleEn">"I am happy today!"</div>
    <div class="example-pt" id="examplePt">"Eu estou feliz hoje!"</div>
  </div>

  <div class="tip">
    💡 <span id="tipText">Tente usar essa palavra hoje numa frase!</span>
  </div>

  <div style="background:#F0FFF7;border:2px solid #7ECBA1;border-radius:20px;padding:14px 18px;text-align:center;font-size:13px;font-weight:700;color:#3D2B1F;">
    📅 Volte amanhã para uma nova palavra!
  </div>

</main>

<script>
  const words = [
    { en: 'Happy', pt: 'Feliz', emoji: '😊', example_en: '"I am happy today!"', example_pt: '"Eu estou feliz hoje!"', tip: 'Diga para alguém: I am happy! Veja a reação!' },
    { en: 'Beautiful', pt: 'Bonito/a', emoji: '🌸', example_en: '"The flower is beautiful."', example_pt: '"A flor é bonita."', tip: 'Olhe ao redor e diga o que é beautiful!' },
    { en: 'Friend', pt: 'Amigo/a', emoji: '👫', example_en: '"She is my best friend."', example_pt: '"Ela é minha melhor amiga."', tip: 'Chame seu amigo de friend hoje!' },
    { en: 'Delicious', pt: 'Delicioso', emoji: '😋', example_en: '"This pizza is delicious!"', example_pt: '"Essa pizza é deliciosa!"', tip: 'Na próxima refeição, diga: This is delicious!' },
    { en: 'Funny', pt: 'Engraçado', emoji: '😂', example_en: '"That movie is so funny!"', example_pt: '"Esse filme é muito engraçado!"', tip: 'Quando rir de algo, diga: This is funny!' },
    { en: 'Strong', pt: 'Forte', emoji: '💪', example_en: '"You are so strong!"', example_pt: '"Você é muito forte!"', tip: 'Diga para alguém: You are strong!' },
    { en: 'Wonderful', pt: 'Maravilhoso', emoji: '🌟', example_en: '"What a wonderful day!"', example_pt: '"Que dia maravilhoso!"', tip: 'Quando o dia estiver ótimo, diga: What a wonderful day!' },
    { en: 'Dog', pt: 'Cachorro', emoji: '🐶', example_en: '"I have a dog."', example_pt: '"Eu tenho um cachorro."', tip: 'Se você tem um cachorro (ou conhece um), diga: This is my dog!' },
    { en: 'Cat', pt: 'Gato', emoji: '🐱', example_en: '"The cat is sleeping."', example_pt: '"O gato está dormindo."', tip: 'Da próxima vez que vir um gato, diga: Look, a cat!' },
    { en: 'Water', pt: 'Água', emoji: '💧', example_en: '"I drink water every day."', example_pt: '"Eu bebo água todo dia."', tip: 'Na próxima vez que beber água, diga: I drink water!' },
    { en: 'Sun', pt: 'Sol', emoji: '☀️', example_en: '"The sun is bright."', example_pt: '"O sol está brilhante."', tip: 'Num dia ensolarado, diga: The sun is bright today!' },
    { en: 'Book', pt: 'Livro', emoji: '📖', example_en: '"I love this book."', example_pt: '"Eu amo esse livro."', tip: 'Mostre seu livro favorito e diga: I love this book!' },
    { en: 'School', pt: 'Escola', emoji: '🏫', example_en: '"I go to school."', example_pt: '"Eu vou à escola."', tip: 'Amanhã de manhã, diga: I go to school!' },
    { en: 'Family', pt: 'Família', emoji: '👨‍👩‍👧', example_en: '"My family is big."', example_pt: '"Minha família é grande."', tip: 'Diga sobre sua família: My family is... (big, small, fun!)' },
    { en: 'House', pt: 'Casa', emoji: '🏠', example_en: '"This is my house."', example_pt: '"Essa é minha casa."', tip: 'Quando chegar em casa, diga: This is my house!' },
    { en: 'Fast', pt: 'Rápido', emoji: '⚡', example_en: '"The car is fast."', example_pt: '"O carro é rápido."', tip: 'Quando correr, diga: I am fast!' },
    { en: 'Slow', pt: 'Devagar', emoji: '🐢', example_en: '"The turtle is slow."', example_pt: '"A tartaruga é devagar."', tip: 'Quando fizer algo devagar, diga: I am slow!' },
    { en: 'Big', pt: 'Grande', emoji: '🐘', example_en: '"The elephant is big."', example_pt: '"O elefante é grande."', tip: 'Aponte pra algo grande e diga: That is big!' },
    { en: 'Small', pt: 'Pequeno', emoji: '🐭', example_en: '"The mouse is small."', example_pt: '"O rato é pequeno."', tip: 'Aponte pra algo pequeno e diga: That is small!' },
    { en: 'Sad', pt: 'Triste', emoji: '😢', example_en: '"Don\'t be sad."', example_pt: '"Não fique triste."', tip: 'Se alguém estiver triste, console com: Don\'t be sad!' },
    { en: 'Brave', pt: 'Corajoso', emoji: '🦁', example_en: '"The lion is brave."', example_pt: '"O leão é corajoso."', tip: 'Quando fizer algo difícil, diga: I am brave!' },
    { en: 'Kind', pt: 'Gentil', emoji: '💛', example_en: '"Be kind to others."', example_pt: '"Seja gentil com os outros."', tip: 'Faça algo gentil hoje e pense: I am kind!' },
    { en: 'Smart', pt: 'Inteligente', emoji: '🧠', example_en: '"She is very smart."', example_pt: '"Ela é muito inteligente."', tip: 'Depois de aprender algo novo, diga: I am smart!' },
    { en: 'Music', pt: 'Música', emoji: '🎵', example_en: '"I love music."', example_pt: '"Eu amo música."', tip: 'Quando ouvir sua música favorita, diga: I love this music!' },
    { en: 'Dance', pt: 'Dançar', emoji: '💃', example_en: '"Let\'s dance!"', example_pt: '"Vamos dançar!"', tip: 'Chame alguém pra dançar: Let\'s dance!' },
    { en: 'Sing', pt: 'Cantar', emoji: '🎤', example_en: '"I like to sing."', example_pt: '"Eu gosto de cantar."', tip: 'Cante sua música favorita e diga: I like to sing!' },
    { en: 'Jump', pt: 'Pular', emoji: '🤸', example_en: '"Jump high!"', example_pt: '"Pule alto!"', tip: 'Pule bem alto e grite: Jump!' },
    { en: 'Run', pt: 'Correr', emoji: '🏃', example_en: '"Let\'s run!"', example_pt: '"Vamos correr!"', tip: 'Chame alguém pra correr: Let\'s run!' },
    { en: 'Play', pt: 'Brincar', emoji: '🧸', example_en: '"Let\'s play together."', example_pt: '"Vamos brincar juntos."', tip: 'Convide um amigo: Let\'s play together!' },
    { en: 'Draw', pt: 'Desenhar', emoji: '🎨', example_en: '"I like to draw."', example_pt: '"Eu gosto de desenhar."', tip: 'Faça um desenho e diga: I like to draw!' },
    { en: 'Read', pt: 'Ler', emoji: '📚', example_en: '"I read every night."', example_pt: '"Eu leio toda noite."', tip: 'Antes de dormir hoje, diga: I read every night!' },
    { en: 'Rain', pt: 'Chuva', emoji: '🌧️', example_en: '"I like the rain."', example_pt: '"Eu gosto da chuva."', tip: 'Num dia de chuva, diga: I like the rain!' },
    { en: 'Snow', pt: 'Neve', emoji: '❄️', example_en: '"Snow is cold."', example_pt: '"A neve é fria."', tip: 'Se você já viu neve, diga: Snow is cold!' },
    { en: 'Rainbow', pt: 'Arco-íris', emoji: '🌈', example_en: '"Look at the rainbow!"', example_pt: '"Olha o arco-íris!"', tip: 'Se ver um arco-íris, grite: Look, a rainbow!' },
    { en: 'Star', pt: 'Estrela', emoji: '⭐', example_en: '"The star is shining."', example_pt: '"A estrela está brilhando."', tip: 'À noite, aponte pro céu e diga: Look, a star!' },
    { en: 'Moon', pt: 'Lua', emoji: '🌙', example_en: '"The moon is beautiful."', example_pt: '"A lua é linda."', tip: 'À noite, aponte pra lua e diga: The moon is beautiful!' },
    { en: 'Ocean', pt: 'Oceano', emoji: '🌊', example_en: '"The ocean is big."', example_pt: '"O oceano é grande."', tip: 'Se você já viu o mar, diga: The ocean is big!' },
    { en: 'Mountain', pt: 'Montanha', emoji: '⛰️', example_en: '"The mountain is tall."', example_pt: '"A montanha é alta."', tip: 'Se você já viu uma montanha, diga: The mountain is tall!' },
    { en: 'Forest', pt: 'Floresta', emoji: '🌳', example_en: '"The forest is green."', example_pt: '"A floresta é verde."', tip: 'Se você já visitou uma floresta, diga: The forest is green!' },
    { en: 'Bird', pt: 'Pássaro', emoji: '🐦', example_en: '"The bird can fly."', example_pt: '"O pássaro pode voar."', tip: 'Se ver um pássaro, diga: Look, a bird!' },
    { en: 'Fish', pt: 'Peixe', emoji: '🐟', example_en: '"The fish can swim."', example_pt: '"O peixe pode nadar."', tip: 'Se ver um peixe, diga: Look, a fish!' },
    { en: 'Butterfly', pt: 'Borboleta', emoji: '🦋', example_en: '"The butterfly is colorful."', example_pt: '"A borboleta é colorida."', tip: 'Se ver uma borboleta, diga: Look, a butterfly!' },
    { en: 'Birthday', pt: 'Aniversário', emoji: '🎂', example_en: '"Happy birthday!"', example_pt: '"Feliz aniversário!"', tip: 'No próximo aniversário de alguém, diga: Happy birthday!' },
    { en: 'Present', pt: 'Presente', emoji: '🎁', example_en: '"I love presents."', example_pt: '"Eu amo presentes."', tip: 'Quando ganhar um presente, diga: I love this present!' },
    { en: 'Party', pt: 'Festa', emoji: '🎉', example_en: '"Let\'s have a party!"', example_pt: '"Vamos fazer uma festa!"', tip: 'Antes de uma festa, diga: Let\'s have a party!' },
    { en: 'Team', pt: 'Time', emoji: '⚽', example_en: '"We are a team."', example_pt: '"Nós somos um time."', tip: 'Jogando com amigos, diga: We are a team!' },
    { en: 'Winner', pt: 'Vencedor', emoji: '🏆', example_en: '"You are a winner!"', example_pt: '"Você é um vencedor!"', tip: 'Quando alguém ganhar algo, diga: You are a winner!' },
    { en: 'Adventure', pt: 'Aventura', emoji: '🗺️', example_en: '"Let\'s go on an adventure!"', example_pt: '"Vamos numa aventura!"', tip: 'Antes de um passeio, diga: Let\'s go on an adventure!' },
    { en: 'Dream', pt: 'Sonho', emoji: '💭', example_en: '"Follow your dreams."', example_pt: '"Siga seus sonhos."', tip: 'Pense no que você quer ser e diga: I have a dream!' },
    { en: 'Hero', pt: 'Herói', emoji: '🦸', example_en: '"You are my hero."', example_pt: '"Você é meu herói."', tip: 'Diga pra alguém especial: You are my hero!' },
    { en: 'Magic', pt: 'Mágica', emoji: '✨', example_en: '"This is magic!"', example_pt: '"Isso é mágica!"', tip: 'Quando algo legal acontecer, diga: This is magic!' },
    { en: 'Curious', pt: 'Curioso', emoji: '🔍', example_en: '"I am curious."', example_pt: '"Eu sou curioso."', tip: 'Quando quiser saber mais sobre algo, diga: I am curious!' },
    { en: 'Grateful', pt: 'Grato', emoji: '🙏', example_en: '"I am grateful for you."', example_pt: '"Eu sou grato por você."', tip: 'Diga pra alguém importante: I am grateful for you!' },
    { en: 'Proud', pt: 'Orgulhoso', emoji: '🌟', example_en: '"I am proud of you."', example_pt: '"Eu tenho orgulho de você."', tip: 'Quando alguém conseguir algo, diga: I am proud of you!' },
    { en: 'Patience', pt: 'Paciência', emoji: '⏳', example_en: '"Have patience."', example_pt: '"Tenha paciência."', tip: 'Quando precisar esperar, diga pra você mesmo: Have patience!' },
  ];

  // Choose word based on day of year so it changes daily
  const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  let currentIdx = dayOfYear % words.length;

  function showWord(idx) {
    const w = words[idx];
    document.getElementById('wordEmoji').textContent = w.emoji;
    document.getElementById('wordEn').textContent = w.en;
    document.getElementById('wordPt').textContent = w.pt;
    document.getElementById('exampleEn').textContent = w.example_en;
    document.getElementById('examplePt').textContent = w.example_pt;
    document.getElementById('tipText').textContent = w.tip;
  }

  let __ttsVoice = null;
  function __pickTtsVoice(){ if(!window.speechSynthesis) return null; const voices=window.speechSynthesis.getVoices(); if(!voices.length) return null; const en=voices.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0); if(!en.length) return null; const NOVELTY=/\b(albert|bad news|bahh|bells|boing|bubbles|cellos|wobble|deranged|good news|hysterical|pipe organ|trinoids|whisper|zarvox|jester|organ|superstar|fred|ralph)\b/i; const normal=en.filter(v=>!NOVELTY.test(v.name)); const base=normal.length?normal:en; const sysDefault=base.find(v=>v.default); if(sysDefault) return sysDefault; const exact=base.filter(v=>v.lang.toLowerCase()==='en-us'); const pool=exact.length?exact:base; const pref=pool.find(v=>/siri|google|natural|online|enhanced|premium/i.test(v.name)||/enhanced|premium/i.test(v.voiceURI||'')); return pref||pool[0]; }
  if (window.speechSynthesis) { __ttsVoice = __pickTtsVoice(); window.speechSynthesis.onvoiceschanged = () => { __ttsVoice = __pickTtsVoice(); }; }

  document.getElementById('btnAudio').addEventListener('click', () => {
    if (!window.speechSynthesis) return;
    const w = words[currentIdx];
    const u = new SpeechSynthesisUtterance(w.en.toLowerCase());
    u.lang = 'en-US'; if (__ttsVoice) u.voice = __ttsVoice; u.rate = 0.8; u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  });

  showWord(currentIdx);
</script>
</body>
</html>
