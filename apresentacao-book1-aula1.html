<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book 1 · Aula 1 — Hello! · itsbrendacleto</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF7F2; --sand: #EDE8DF; --brown: #5C4033; --brown-light: #8B6355;
    --mint: #A8C5B5; --rose: #E8A598; --gold: #D8B15C; --text: #2C1F1A; --muted: #7A6560;
    --white: #FFFFFF; --shadow: 0 8px 40px rgba(0,0,0,0.18);
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif; background: var(--brown); color: var(--text);
  }

  /* ---- Slides ---- */
  .deck { position: relative; width: 100vw; height: 100vh; }
  .slide {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    padding: 6vh 8vw; text-align: center;
  }
  .slide.active { display: flex; }

  .slide.title { background: linear-gradient(135deg, var(--brown), #3E2A1F); color: var(--white); }
  .slide.title .eyebrow { font-size: 1.1rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
  .slide.title h1 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: clamp(2.4rem, 6vw, 5rem); line-height: 1.15; }
  .slide.title .sub { margin-top: 20px; font-size: clamp(1.1rem, 2.4vw, 1.6rem); color: rgba(255,255,255,0.75); }

  .slide.text { background: var(--cream); }
  .slide.text .eyebrow { font-size: 1rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--brown-light); margin-bottom: 14px; }
  .slide.text h2 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: clamp(2rem, 4.2vw, 3.4rem); color: var(--text); margin-bottom: 32px; }
  .slide.text ul { list-style: none; display: flex; flex-direction: column; gap: 18px; max-width: 900px; }
  .slide.text li {
    background: var(--white); border-radius: 16px; padding: 20px 32px; box-shadow: 0 4px 16px rgba(92,64,51,0.08);
    font-size: clamp(1.2rem, 2.6vw, 1.8rem); font-weight: 600; display: flex; align-items: center; gap: 16px;
  }
  .slide.text li .emoji { font-size: 1.4em; flex-shrink: 0; }
  .slide.text p { font-size: clamp(1.2rem, 2.6vw, 1.9rem); line-height: 1.6; max-width: 900px; color: var(--text); }

  .slide.image { background: var(--text); padding: 2vh 2vw; }
  .slide.image img { max-width: 96vw; max-height: 96vh; border-radius: 12px; box-shadow: var(--shadow); object-fit: contain; }
  .slide.image .caption { margin-top: 16px; color: rgba(255,255,255,0.7); font-size: 1.1rem; }

  .slide.video, .slide.embed { background: #111; }
  .slide.video .frame-wrap, .slide.embed .frame-wrap {
    width: 100%; max-width: 1100px; aspect-ratio: 16 / 9; background: #000;
    border-radius: 16px; overflow: hidden; box-shadow: var(--shadow);
  }
  .slide.embed .frame-wrap { aspect-ratio: 4 / 3; max-width: 700px; background: var(--white); }
  .slide.video iframe, .slide.embed iframe { width: 100%; height: 100%; border: 0; display: block; }
  .slide.video .eyebrow, .slide.embed .eyebrow { color: rgba(255,255,255,0.65); margin-bottom: 16px; font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

  /* ---- Nav bar ---- */
  .navbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: rgba(0,0,0,0.35); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 0.25s ease;
  }
  .deck:hover .navbar, .navbar:focus-within, .navbar.show { opacity: 1; }
  .nav-btn {
    background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.3); color: #fff;
    border-radius: 10px; padding: 10px 18px; font-family: 'DM Sans', sans-serif; font-weight: 600;
    font-size: 14px; cursor: pointer; transition: background 0.15s;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.28); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-count { color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
  .nav-right { display: flex; gap: 10px; align-items: center; }
  .nav-back { position: fixed; top: 14px; left: 14px; z-index: 51; text-decoration: none; }
</style>
</head>
<body>

<a class="nav-btn nav-back" href="material-de-aula.html">← Voltar</a>

<div class="deck" id="deck"></div>

<div class="navbar" id="navbar">
  <button class="nav-btn" id="btnPrev">← Anterior</button>
  <span class="nav-count" id="navCount"></span>
  <div class="nav-right">
    <button class="nav-btn" id="btnFullscreen">⛶ Tela cheia</button>
    <button class="nav-btn" id="btnNext">Próximo →</button>
  </div>
</div>

<script>
/*
  BOOK 1 — AULA 1 — Hello! What's your name?
  Gerado a partir do material da Brenda (Canva). Pra adicionar vídeo do
  YouTube ou exercício do Wordwall nessa aula, é só inserir um objeto
  { type: 'video', eyebrow: '...', youtubeId: '...' } ou
  { type: 'embed', eyebrow: '...', src: '...' } no meio do array abaixo.
*/

const SLIDES = [
  { type: 'image', src: 'assets/apresentacoes/book1-aula1/1.png', caption: 'Hello — My name is...' },
  { type: 'image', src: 'assets/apresentacoes/book1-aula1/2.png', caption: 'Greetings' },
  { type: 'image', src: 'assets/apresentacoes/book1-aula1/3.png', caption: 'What is your name?' },
  { type: 'image', src: 'assets/apresentacoes/book1-aula1/4.png', caption: 'Listening/matching — names' },
  { type: 'image', src: 'assets/apresentacoes/book1-aula1/5.png', caption: 'The Alphabet' },
  { type: 'image', src: 'assets/apresentacoes/book1-aula1/6.png', caption: 'How do you spell your name?' },
  { type: 'image', src: 'assets/apresentacoes/book1-aula1/7.png', caption: 'Listen to the audio and write the names' }
];

/* ---------------- RENDER ---------------- */
const deck = document.getElementById('deck');

function renderSlide(s) {
  const el = document.createElement('div');
  el.className = 'slide ' + s.type;

  if (s.type === 'title') {
    el.innerHTML = `
      ${s.eyebrow ? `<div class="eyebrow">${s.eyebrow}</div>` : ''}
      <h1>${s.title}</h1>
      ${s.sub ? `<div class="sub">${s.sub}</div>` : ''}`;
  } else if (s.type === 'text') {
    const body = s.items
      ? `<ul>${s.items.map(i => `<li><span class="emoji">${i.emoji || ''}</span><span>${i.text}</span></li>`).join('')}</ul>`
      : `<p>${s.paragraph || ''}</p>`;
    el.innerHTML = `
      ${s.eyebrow ? `<div class="eyebrow">${s.eyebrow}</div>` : ''}
      ${s.title ? `<h2>${s.title}</h2>` : ''}
      ${body}`;
  } else if (s.type === 'image') {
    el.innerHTML = `
      <img src="${s.src}" alt="" />
      ${s.caption ? `<div class="caption">${s.caption}</div>` : ''}`;
  } else if (s.type === 'video') {
    el.innerHTML = `
      ${s.eyebrow ? `<div class="eyebrow">${s.eyebrow}</div>` : ''}
      <div class="frame-wrap">
        <iframe src="https://www.youtube.com/embed/${s.youtubeId}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
      </div>`;
  } else if (s.type === 'embed') {
    el.innerHTML = `
      ${s.eyebrow ? `<div class="eyebrow">${s.eyebrow}</div>` : ''}
      <div class="frame-wrap">
        ${s.src
          ? `<iframe src="${s.src}" allowfullscreen loading="lazy"></iframe>`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted);font-size:1.1rem;">Cole aqui o link de embed do Wordwall</div>`}
      </div>`;
  }
  return el;
}

SLIDES.forEach(s => deck.appendChild(renderSlide(s)));
const slideEls = Array.from(deck.children);

let current = 0;
function goTo(i) {
  if (i < 0 || i >= slideEls.length) return;
  slideEls[current].classList.remove('active');
  current = i;
  slideEls[current].classList.add('active');
  document.getElementById('navCount').textContent = (current + 1) + ' / ' + slideEls.length;
  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').disabled = current === slideEls.length - 1;
}
goTo(0);

document.getElementById('btnPrev').addEventListener('click', () => goTo(current - 1));
document.getElementById('btnNext').addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); goTo(current + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(current - 1); }
  else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
});

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}
document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);
</script>
</body>
</html>
