      vocab: [{ w: 'forget', m: 'esquecer' }, { w: 'feel', m: 'sentir' }, { w: 'said', m: 'disse' }]
    },
    {
      en: '"Life is either a daring adventure or nothing at all."',
      pt: '"A vida é ou uma aventura ousada ou nada."',
      author: '— Helen Keller',
      vocab: [{ w: 'daring', m: 'ousado' }, { w: 'adventure', m: 'aventura' }, { w: 'nothing', m: 'nada' }]
    },
    {
      en: '"All our dreams can come true, if we have the courage to pursue them."',
      pt: '"Todos os nossos sonhos podem se realizar, se tivermos coragem para persegui-los."',
      author: '— Walt Disney',
      vocab: [{ w: 'dreams', m: 'sonhos' }, { w: 'courage', m: 'coragem' }, { w: 'pursue', m: 'perseguir' }]
    },
    {
      en: '"It does not matter how slowly you go as long as you do not stop."',
      pt: '"Não importa o quão devagar você vá, contanto que não pare."',
      author: '— Confúcio',
      vocab: [{ w: 'slowly', m: 'devagar' }, { w: 'stop', m: 'parar' }, { w: 'matter', m: 'importar' }]
    },
  ];

  const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  let idx = dayOfYear % quotes.length;

  function showQuote(i) {
    const q = quotes[i];
    document.getElementById('quoteText').textContent = q.en;
    document.getElementById('quoteAuthor').textContent = q.author;
    document.getElementById('quotePt').textContent = q.pt;
    const list = document.getElementById('vocabList');
    list.innerHTML = q.vocab.map(v => `<div class="vocab-item"><span class="vocab-word">${v.w}</span><span class="vocab-meaning">${v.m}</span></div>`).join('');
  }

  let __ttsVoice = null;
  function __pickTtsVoice(){ if(!window.speechSynthesis) return null; const voices=window.speechSynthesis.getVoices(); if(!voices.length) return null; const en=voices.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0); if(!en.length) return null; const NOVELTY=/\b(albert|bad news|bahh|bells|boing|bubbles|cellos|wobble|deranged|good news|hysterical|pipe organ|trinoids|whisper|zarvox|jester|organ|superstar|fred|ralph)\b/i; const normal=en.filter(v=>!NOVELTY.test(v.name)); const base=normal.length?normal:en; const sysDefault=base.find(v=>v.default); if(sysDefault) return sysDefault; const exact=base.filter(v=>v.lang.toLowerCase()==='en-us'); const pool=exact.length?exact:base; const pref=pool.find(v=>/siri|google|natural|online|enhanced|premium/i.test(v.name)||/enhanced|premium/i.test(v.voiceURI||'')); return pref||pool[0]; }
  if (window.speechSynthesis) { __ttsVoice = __pickTtsVoice(); window.speechSynthesis.onvoiceschanged = () => { __ttsVoice = __pickTtsVoice(); }; }

  document.getElementById('btnAudio').addEventListener('click', () => {
    if (!window.speechSynthesis) return;
    const text = quotes[idx].en.replace(/["""]/g, '');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (__ttsVoice) u.voice = __ttsVoice; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  });

  showQuote(idx);

  // ---- Volta pro painel certo dependendo de quem está logado ----
  (async () => {
    try {
      const SUPABASE_URL = 'https://vbqumpzlxseakvmyvkem.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_NjK_Rdqnl1ZCRd9LlUG-fA_OvdYsKvj';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storage: window.localStorage, autoRefreshToken: true, detectSessionInUrl: false, lock: async (_n, _t, fn) => fn() } });
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;
      const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
      if (profile && profile.role === 'professora') {
        document.getElementById('backBtn').href = 'painel-professora.html';
      }
    } catch (e) { /* mantém o link padrão se der erro */ }
  })();

  // ---- Compartilhar no Instagram ----
  function getWrappedLines(ctx, text, maxWidth) {
    const words = text.split(' ');
    let line = '';
    const lines = [];
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  async function shareToInstagram() {
    const btn = document.getElementById('btnShare');
    const original = btn.textContent;
    btn.textContent = 'Gerando...';
    btn.disabled = true;
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;

      const q = quotes[idx];
      const W = 1080, H = 1920;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#5C4033';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.font = 'italic 520px "DM Serif Display", Georgia, serif';
      ctx.textAlign = 'left';
      ctx.fillText('"', 40, 640);

      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '600 30px "DM Sans", sans-serif';
      ctx.fillText('F R A S E   D O   D I A', W / 2, 280);

      ctx.font = 'italic 58px "DM Serif Display", Georgia, serif';
      const quoteLines = getWrappedLines(ctx, q.en, 900);
      const quoteLineHeight = 76;
      const quoteBlockHeight = (quoteLines.length - 1) * quoteLineHeight;
      const quoteStartY = 820 - quoteBlockHeight / 2;
      ctx.fillStyle = '#FFFFFF';
      quoteLines.forEach((l, i) => ctx.fillText(l, W / 2, quoteStartY + i * quoteLineHeight));

      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '500 32px "DM Sans", sans-serif';
      ctx.fillText(q.author, W / 2, quoteStartY + quoteBlockHeight + 80);

      ctx.font = 'italic 36px "DM Sans", sans-serif';
      const transLines = getWrappedLines(ctx, q.pt, 900);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      const transStartY = H - 420;
      transLines.forEach((l, i) => ctx.fillText(l, W / 2, transStartY + i * 46));

      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '600 28px "DM Sans", sans-serif';
      ctx.fillText('itsbrendacleto', W / 2, H - 100);

      canvas.toBlob(async (blob) => {
        if (!blob) { alert('Não foi possível gerar a imagem.'); return; }
        const file = new File([blob], 'frase-do-dia.png', { type: 'image/png' });
        let shared = false;
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Frase do dia', text: 'Frase do dia — itsbrendacleto' });
            shared = true;
          } catch (e) { /* usuário cancelou o compartilhamento */ shared = true; }
        }
        if (!shared) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'frase-do-dia.png';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }
      }, 'image/png');
    } finally {
      btn.textContent = original;
      btn.disabled = false;
    }
  }

  document.getElementById('btnShare').addEventListener('click', shareToInstagram);
</script>
