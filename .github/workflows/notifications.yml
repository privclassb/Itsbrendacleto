name: Notificações push

"on":
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só mostra o que seria enviado, sem mandar nada de verdade'
        type: boolean
        default: false
      test_email:
        description: 'Preenchendo isso, ignora os 4 lembretes reais e manda só uma notificação de teste pra esse e-mail'
        type: string
        default: ''
      test_heading:
        description: 'Título customizado do teste (opcional, só usado junto com test_email)'
        type: string
        default: ''
      test_content:
        description: 'Texto customizado do teste (opcional, só usado junto com test_email)'
        type: string
        default: ''
      broadcast_heading:
        description: 'Preenchendo isso (junto com broadcast_content), manda essa notificação pra TODO MUNDO (alunos + professoras), sem mexer nos lembretes reais'
        type: string
        default: ''
      broadcast_content:
        description: 'Texto da notificação avulsa pra todo mundo (só usado junto com broadcast_heading)'
        type: string
        default: ''
      show_stats:
        description: 'Marque pra só mostrar quantas pessoas têm notificação ativada de verdade (não manda nada)'
        type: boolean
        default: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enviar lembretes
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TEST_EMAIL: ${{ github.event.inputs.test_email || '' }}
          TEST_HEADING: ${{ github.event.inputs.test_heading || '' }}
          TEST_CONTENT: ${{ github.event.inputs.test_content || '' }}
          BROADCAST_HEADING: ${{ github.event.inputs.broadcast_heading || '' }}
          BROADCAST_CONTENT: ${{ github.event.inputs.broadcast_content || '' }}
          SHOW_STATS: ${{ github.event.inputs.show_stats || 'false' }}
        run: node scripts/send-notifications.js
