name: Notificações push

"on":
  # Agendamento (cron) fica desligado até a Brenda confirmar o primeiro envio real.
  # Pra ligar: descomentar as 2 linhas abaixo.
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só mostra o que seria enviado, sem mandar nada de verdade'
        type: boolean
        default: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enviar lembretes
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/send-notifications.js
