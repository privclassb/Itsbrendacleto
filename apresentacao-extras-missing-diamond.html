<title>The Missing Diamond</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Courier+Prime:wght@400;700&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
/* Layout: a detective's desk at night — sticky case header with the six-mission track, one scene at a time below, documents as cream paper on deep navy */
:root{
  --navy:#0e1828; --navy2:#142238; --navy3:#1d2f4d; --line:#2b4166;
  --gold:#c9a24a; --gold2:#e8cd86; --paper:#efe5ca; --ink:#2a241b;
  --burg:#7a1f33; --burg2:#c25a72; --green:#3d9a69; --green2:#86d6a8;
  --text:#ebe5d8; --muted:#9eabc2;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --type:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--navy)}
body{color:var(--text);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--navy)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(14,24,40,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em;white-space:nowrap;background:none;border:0;cursor:pointer;padding:0}
.brand em{font-style:italic;font-weight:500;color:var(--gold2)}
.track{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;border:1px solid transparent;background:none;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.step .n{font-family:var(--type);font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line)}
.step.done{color:var(--text)} .step.done .n{background:var(--green);border-color:var(--green);color:#fff}
.step.now{color:var(--gold2);border-color:rgba(201,162,74,.5);background:rgba(201,162,74,.08)} .step.now .n{border-color:var(--gold);color:var(--gold2)}
.step[disabled]{opacity:.38;cursor:not-allowed}
.tools{display:flex;gap:6px;align-items:center}
.icon-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--navy2);font-size:13px;font-weight:600;cursor:pointer}
.icon-btn:hover{border-color:var(--gold)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.t{border-style:dashed;color:var(--muted);font-weight:500}
.icon-btn.t.on{color:var(--gold2);border-color:var(--gold)}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene{display:flex;flex-direction:column;gap:22px;animation:rise .45s ease both}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(30px,4.4vw,46px)}
h3{font-size:22px}
.lede{margin:6px 0 0;color:var(--muted);font-size:17px;max-width:62ch}
.head{display:flex;flex-direction:column;gap:8px}
.panel{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:#16120a;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:var(--gold2);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--gold2)}
.btn.ghost:hover{background:rgba(201,162,74,.1)}
.btn.small{padding:9px 14px;font-size:13px}
.btn svg{width:18px;height:18px}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;border:1px dashed var(--gold);background:rgba(201,162,74,.06);color:var(--gold2);font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.02em}
.tbtn:hover{background:rgba(201,162,74,.16)}
.tbtn svg{width:14px;height:14px}
.tbtn small{font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10px}
.speak{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--navy3);cursor:pointer;flex:none}
.speak:hover{border-color:var(--gold)}
.speak svg{width:16px;height:16px}

/* paper documents */
.paper{background:var(--paper);color:var(--ink);font-family:var(--type);font-size:15px;line-height:1.5;padding:20px 20px 18px;border-radius:3px;box-shadow:0 12px 28px rgba(0,0,0,.4);position:relative}
.paper h4{font-family:var(--body);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 10px;color:#6b5a3a}
.paper .big{font-family:var(--display);font-size:22px;font-weight:700;margin:0 0 8px;color:var(--ink)}
.stamp{position:absolute;top:12px;right:14px;border:2px solid var(--burg);color:var(--burg);font:700 10px/1 var(--body);letter-spacing:.16em;padding:4px 7px;transform:rotate(7deg);border-radius:2px;opacity:.85}
.hand{font-family:var(--display);font-style:italic;font-size:19px}
.paper table{border-collapse:collapse;width:100%;font-size:14px}
.paper td{border-bottom:1px dashed #b9a77d;padding:5px 4px;vertical-align:top}
.paper .x{color:var(--burg);font-weight:700}

/* intro */
.intro{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center}
.intro .art{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.45)}
.intro .art svg{display:block;width:100%;height:auto}
.intro h1{font-size:clamp(40px,6vw,72px);letter-spacing:-.01em}
.intro h1 em{display:block;font-style:italic;font-weight:500;color:var(--gold2);font-size:.5em;letter-spacing:.02em;margin-top:6px}
.welcome{font-family:var(--type);font-size:17px;line-height:1.7;background:var(--paper);color:var(--ink);padding:22px 24px;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.4);position:relative}
.welcome p{margin:0 0 4px}
.welcome .lab{font-family:var(--body);font-weight:700;letter-spacing:.2em;font-size:11px;color:var(--burg);margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);font:500 16px var(--body);width:100%}
.field input:focus,.field textarea:focus{border-color:var(--gold);outline:none}

/* mission 1 */
.m1{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.room-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b1322;position:relative}
.room{display:block;width:100%;height:auto}
.hot{cursor:pointer;transition:filter .2s}
.hot:hover,.hot:focus{filter:drop-shadow(0 0 7px rgba(232,205,134,.95));outline:none}
.hot.sel{filter:drop-shadow(0 0 10px rgba(232,205,134,1))}
.room-tip{position:absolute;left:12px;bottom:10px;background:rgba(14,24,40,.85);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.clue-card{min-height:230px;display:flex;flex-direction:column;gap:14px}
.qbig{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.15;color:var(--gold2)}
.answer{display:flex;align-items:center;gap:10px;background:rgba(61,154,105,.14);border:1px solid rgba(61,154,105,.5);border-radius:10px;padding:10px 12px;font-weight:600;color:var(--green2)}
.checklist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.checklist li .b{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.checklist li.ok{color:var(--text)} .checklist li.ok .b{background:var(--green);border-color:var(--green)}
.checklist li .b svg{width:12px;height:12px}
.meter{height:6px;background:var(--navy);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
.banner{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;background:linear-gradient(120deg,rgba(61,154,105,.22),rgba(61,154,105,.06));border:1px solid rgba(61,154,105,.55);border-radius:14px;padding:18px 20px;animation:pop .45s ease both}
.banner strong{font-family:var(--display);font-size:24px;display:block}
.banner.alert{background:linear-gradient(120deg,rgba(122,31,51,.45),rgba(122,31,51,.12));border-color:var(--burg2)}
.banner.alert strong{color:#ffd9e1}

/* mission 2 */
.docs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.docbtn{all:unset;cursor:pointer;display:block}
.docbtn .paper{transition:transform .2s;min-height:150px}
.docbtn:nth-child(odd) .paper{transform:rotate(-1.2deg)}
.docbtn:nth-child(even) .paper{transform:rotate(1deg)}
.docbtn:hover .paper,.docbtn:focus-visible .paper{transform:rotate(0) translateY(-4px)}
.docbtn .open{display:block;margin-top:10px;font:700 11px var(--body);letter-spacing:.16em;color:#7a6338}
.cal{width:100%;font-family:var(--body);text-align:center;font-size:13px}
.cal th{font-size:10px;letter-spacing:.1em;color:#7a6338;padding:3px}
.cal td{border:0;padding:4px 0}
.cal td.hl{background:var(--burg);color:#fff;border-radius:50%;font-weight:700}
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;position:relative}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:12px;min-height:150px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.015);transition:border-color .2s,background .2s;cursor:pointer}
.slot.ready{border-color:var(--gold);background:rgba(201,162,74,.06)}
.slot.over{border-color:var(--gold2);background:rgba(201,162,74,.12)}
.slot .time{display:flex;align-items:center;gap:8px;font-family:var(--type);font-weight:700;font-size:17px;color:var(--gold2)}
.slot .time svg{width:26px;height:26px}
.slot.filled{border-style:solid;border-color:rgba(61,154,105,.6);cursor:default}
.ecard{background:var(--paper);color:var(--ink);font-family:var(--type);font-size:14.5px;line-height:1.35;padding:12px 12px;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.35);cursor:grab;user-select:none;border:2px solid transparent;transition:transform .15s,border-color .15s}
.ecard:hover{transform:translateY(-2px)}
.ecard.picked{border-color:var(--gold);transform:translateY(-3px) rotate(-1deg);box-shadow:0 10px 24px rgba(201,162,74,.3)}
.ecard.placed{cursor:default;box-shadow:none;border-color:rgba(61,154,105,.6)}
.tray{display:flex;gap:12px;flex-wrap:wrap;min-height:60px}
.tray .ecard{flex:1 1 200px;max-width:280px}
.inserted{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:rgba(122,31,51,.25);border:1px solid var(--burg2);border-radius:10px;padding:10px 14px;font-family:var(--type);font-weight:700;animation:pop .5s ease both}
.qlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.qlist li{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--navy3);border-radius:10px;padding:10px 12px;font-weight:600;font-size:16px}
.qlist li.ok{background:rgba(61,154,105,.16)}
.qlist li .q{display:flex;align-items:center;gap:10px;min-width:0}

/* suspects */
.suspects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sus{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--navy2);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s,transform .2s}
.sus:hover,.sus:focus-visible{border-color:var(--gold);transform:translateY(-2px)}
.sus.on{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold2)}
.sus .pic svg{display:block;width:100%;height:auto}
.sus .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.sus .meta b{font-family:var(--display);font-size:21px}
.sus .meta span{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tag{align-self:flex-start;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:var(--navy3);color:var(--muted)}
.tag.ok{background:rgba(61,154,105,.2);color:var(--green2)}
.dossier{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;animation:rise .35s ease both}
.dossier .pic{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.dossier .pic svg{display:block;width:100%;height:auto}
.stmt{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.stmt li{font-family:var(--display);font-style:italic;font-size:20px;line-height:1.3}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qtile{background:var(--navy3);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qtile .hint{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.qtile .model{font-size:19px;font-weight:700;color:var(--gold2)}
.qtile .ans{font-family:var(--display);font-style:italic;font-size:18px;color:var(--text);border-left:3px solid var(--green);padding-left:10px}
.linkbtn{all:unset;cursor:pointer;color:var(--gold2);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.file-box{display:flex;flex-direction:column;gap:2px}

/* evidence board */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
.evlist{display:flex;flex-direction:column;gap:12px}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--paper);color:var(--ink);border-radius:4px;padding:12px 14px;box-shadow:0 8px 18px rgba(0,0,0,.35);cursor:grab;border:2px solid transparent;user-select:none;font-family:var(--type)}
.ev.picked{border-color:var(--gold);transform:translateX(4px)}
.ev.linked{opacity:.45;cursor:default;box-shadow:none}
.ev .lt{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--burg);flex:none;width:26px}
.ev .tt{font-family:var(--body);font-weight:700;font-size:15px}
.ev .ss{font-size:13px;color:#5d4f37}
.ev .opn{margin-left:auto;align-self:center;flex:none;font:700 11px var(--body);letter-spacing:.12em;color:#7a6338;background:none;border:1px solid #b9a77d;border-radius:5px;padding:5px 7px;cursor:pointer}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:230px;cursor:pointer;transition:border-color .2s,background .2s}
.col.ready{border-color:var(--gold);background:rgba(201,162,74,.06)}
.col.over{border-color:var(--gold2);background:rgba(201,162,74,.12)}
.col .who{display:flex;align-items:center;gap:8px}
.col .who svg{width:44px;height:52px;border-radius:6px;flex:none}
.col .who b{font-family:var(--display);font-size:18px;line-height:1.1}
.chip{display:flex;align-items:center;gap:8px;background:rgba(61,154,105,.18);border:1px solid rgba(61,154,105,.5);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;animation:pop .3s ease both}
.chip .l{font-family:var(--display);font-size:18px;color:var(--gold2)}
.liar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.liar button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--navy3);text-align:center;font-family:var(--display);font-size:20px;font-weight:700}
.liar button svg{width:90px;height:105px;border-radius:8px}
.liar button:hover,.liar button:focus-visible{border-color:var(--gold)}
.liar button.on{border-color:var(--burg2);background:rgba(122,31,51,.3)}
.frame{font-family:var(--type);font-size:17px;background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--gold2)}

/* interrogation */
.iroom{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse 60% 70% at 50% -10%,rgba(232,205,134,.22),rgba(232,205,134,0) 60%),linear-gradient(#111b2c,#0a1220);padding:22px}
.lamp{position:absolute;top:0;left:50%;width:120px;height:26px;transform:translateX(-50%);background:#2a2f3a;border-radius:0 0 60px 60px;box-shadow:0 10px 40px rgba(232,205,134,.35)}
.ipick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 18px}
.ipick button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(20,34,56,.9);font-weight:700}
.ipick button svg{width:36px;height:42px;border-radius:50%}
.ipick button.on{border-color:var(--gold2);color:var(--gold2)}
.istage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
.istage .pic svg{display:block;width:100%;height:auto;border-radius:10px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.iq{display:flex;flex-direction:column;gap:10px}
.newev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.newev .paper{font-size:13.5px;padding:14px;min-height:120px}
.locked{border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:13px;min-height:120px;text-align:center;padding:10px}
.locked svg{width:20px;height:20px;display:block;margin:0 auto 6px}

/* report */
.report{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rbox{background:var(--paper);color:var(--ink);border-radius:4px;padding:16px 18px;box-shadow:0 10px 22px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}
.rbox .h{font-family:var(--display);font-weight:700;font-size:26px;color:var(--burg);line-height:1}
.rbox .s{font-family:var(--type);font-size:14px;color:#5d4f37}
.rbox input{background:#f8f2e2;border:1px solid #c9b891;border-radius:6px;padding:10px;font:500 16px var(--type);color:var(--ink);width:100%}
.whopick{display:flex;gap:10px;flex-wrap:wrap}
.whopick button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:8px;border:2px solid transparent;font:700 13px var(--body)}
.whopick button svg{width:62px;height:72px;border-radius:6px}
.whopick button.on{border-color:var(--burg)}
.evchips{display:flex;gap:6px;flex-wrap:wrap}
.evchips button{all:unset;cursor:pointer;font:600 12.5px var(--body);padding:6px 9px;border-radius:6px;border:1px solid #c9b891;background:#f8f2e2}
.evchips button.on{background:var(--burg);color:#fff;border-color:var(--burg)}
.sol{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.sol li{font-family:var(--display);font-size:22px;line-height:1.3;animation:rise .5s ease both;display:flex;gap:12px}
.sol li .t{font-family:var(--type);font-size:14px;color:var(--gold);min-width:84px;padding-top:6px}

/* closed */
.closed{text-align:center;align-items:center}
.closed h1{font-size:clamp(46px,8vw,92px);letter-spacing:.02em}
.closed .bigstamp{display:inline-block;border:4px solid var(--burg2);color:var(--burg2);font:700 clamp(28px,5vw,48px)/1 var(--display);letter-spacing:.08em;padding:10px 22px;transform:rotate(-6deg);animation:stamp .6s cubic-bezier(.2,1.6,.4,1) .2s both}
.gem{width:min(220px,60vw);animation:float 4s ease-in-out infinite}
.gem-wrap{position:relative;display:grid;place-items:center}
.spark{position:absolute;width:8px;height:8px;background:var(--gold2);transform:rotate(45deg);animation:twinkle 1.8s ease-in-out infinite}
.notebook{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;text-align:left}
.notebook .paper ul{margin:0;padding-left:18px}
.notebook .paper .p{font-family:var(--display);font-size:40px;font-weight:700;color:var(--burg);line-height:1}
.stats{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:40px;color:var(--gold2);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* help */
details.help{background:var(--navy2);border:1px solid var(--line);border-radius:12px}
details.help summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details.help summary::-webkit-details-marker{display:none}
details.help summary svg{width:16px;height:16px}
details.help[open] summary{color:var(--gold2)}
.frames{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
.frames span{font-family:var(--type);background:var(--navy3);border-radius:7px;padding:6px 10px;font-size:15px}

/* overlays */
.modal{position:fixed;inset:0;z-index:90;background:rgba(5,9,16,.78);display:grid;place-items:center;padding:20px}
.modal-card{max-width:560px;width:100%;max-height:86vh;overflow:auto;animation:pop .3s ease both}
.modal-card.wide{max-width:760px}
.x-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid #b9a77d;background:#f8f2e2;color:var(--ink);cursor:pointer;font-size:18px;line-height:1;z-index:2}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:85;background:var(--navy2);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:slide .3s ease both}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:1px solid var(--line)}
.drawer .body{overflow:auto;padding:18px 18px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.drawer h4{margin:0 0 6px;font:700 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.drawer ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.empty{color:var(--muted);font-style:italic;font-size:14px}
.tm{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:80;width:min(400px,calc(100% - 28px));max-height:55vh;overflow:auto;background:#1a1408;border:1px dashed var(--gold);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5;color:#f1e4c2;box-shadow:0 20px 40px rgba(0,0,0,.5);animation:rise .3s ease both}
.tm h5{margin:0 0 8px;font:700 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);display:flex;justify-content:space-between;gap:8px}
.tm ul{margin:4px 0 8px;padding-left:18px}
.tm b{color:var(--gold2)}
.tm .close{background:none;border:0;color:var(--gold2);cursor:pointer;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:95;background:var(--navy3);border:1px solid var(--gold);padding:11px 18px;border-radius:999px;font-weight:700;letter-spacing:.02em;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:var(--green);color:var(--green2)}
.toast.warn{border-color:var(--burg2);color:#ffd2dc}
.shake{animation:shake .4s ease}

@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.001;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes twinkle{0%,100%{opacity:0;transform:rotate(45deg) scale(.3)}50%{opacity:1;transform:rotate(45deg) scale(1)}}
@keyframes flick{0%,100%{opacity:.95}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:980px){
  .intro,.m1,.board{grid-template-columns:1fr}
  .docs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .newev{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:700px){
  .timeline{grid-template-columns:repeat(2,minmax(0,1fr))}
  .suspects,.cols,.liar,.notebook{grid-template-columns:1fr}
  .dossier,.istage{grid-template-columns:1fr}
  .dossier .pic,.istage .pic{max-width:180px}
  .qgrid,.report{grid-template-columns:1fr}
  .brand span.full{display:none}
  .icon-btn .lbl{display:none}
}
@media (max-width:440px){.docs,.newev{grid-template-columns:1fr}}

var TMN={
 intro:'<p>Pergunte o nome da aluna e digite no campo: ela vira “Detective ___” na tela final.</p><p>Leia a introdução com ela. Perguntas rápidas: <b>Where was the diamond?</b> → <i>In a special room.</i> <b>Where were the people?</b> → <i>At the hotel.</i></p>',
 1:'<p>A aluna clica nos objetos. Nos objetos com pergunta, <b>ela responde antes</b> e só então você clica em <b>Reveal clue</b>.</p><ul><li>Where is the key? → <i>It’s on the table.</i></li><li>Where is the note? → <i>It’s in the bag.</i></li><li>Where is the box? → <i>It’s in the cabinet.</i></li><li>Where is the photo? → <i>It’s on the wall.</i></li><li>Where is the card? → <i>It’s on the chair.</i></li></ul><p><b>Erros comuns:</b> “in the table”, “on the bag”. Corrija com contraste: <i>Inside or on top?</i> Deixe ela se corrigir.</p><p><b>Extra:</b> Where is the clock? / the camera? (on the wall) · Where is the bag? (on the floor)</p>',
 2:'<p>Ela lê os documentos (clique para abrir) e coloca cada evento no horário certo: toque no cartão e depois no horário (ou arraste).</p><ul><li>When was the exhibition? → <i>On Friday / On October 16th / In October.</i></li><li>What time was the security check? → <i>At 8 p.m.</i></li><li>When did the diamond disappear? → <i>At 9 p.m.</i></li><li>What time did the camera stop? → <i>At 8:45 p.m.</i></li></ul><p><b>Erros comuns:</b> “in Friday”, “in 9 p.m.”. Dica de 1 linha: <b>AT</b> = ponto no relógio · <b>ON</b> = quadradinho do calendário · <b>IN</b> = mês, parte do dia.</p><p>Marque ✓ em cada pergunta respondida.</p>',
 3:'<p>Você interpreta os suspeitos. A aluna escolhe um tema, pode ver o modelo, mas <b>pergunta em voz alta antes</b> de você clicar em Answer.</p><ul><li>Emma: reception às 9 · office à tarde.</li><li>Jack: main entrance às 9 · em casa à tarde · cartão “in my pocket”.</li><li>Sophia: “restaurant” às 9 (mentira) · airport à tarde · bolsa “in the event room”.</li></ul><p><b>Erro comum:</b> “Where you were?” → modele <i>Where <b>were</b> you…?</i> Não transforme em aula de passado.</p><p>Cada suspeito precisa de pelo menos 2 perguntas.</p>',

function layer(h){$('#layer').innerHTML=h;}
function modal(inner,wide){layer('<div class="modal" data-act="closeLayer" data-self="1"><div class="modal-card'+(wide?' wide':'')+'" style="position:relative"><button class="x-btn" data-act="closeLayer" aria-label="Close">×</button>'+inner+'</div></div>');}
function toast(m,t){var el=$('#toast');el.textContent=m;el.className='toast show '+(t||'');clearTimeout(toast._t);toast._t=setTimeout(function(){el.className='toast';},2200);}
function confirmRestart(){modal('<div class="paper" style="padding:26px"><span class="stamp">NEW CASE</span><p class="big">Start a new investigation?</p><p>All progress will be deleted.</p><div class="row" style="margin-top:14px"><button class="btn" data-act="doRestart">Yes, restart</button><button class="btn ghost" data-act="closeLayer" style="color:#7a1f33;border-color:#7a1f33">Cancel</button></div></div>');}
function caseFile(){
 var f=S.m1.found,b='';
 var clues=Object.keys(M1).filter(function(k){return f[k];}).map(function(k){return '<li><b>'+M1[k].title+':</b> '+M1[k].text.replace(/<span class="hand">|<\/span>/g,'')+'</li>';}).join('');
 b+='<div><h4>Crime scene clues</h4>'+(clues?'<ul>'+clues+'</ul>':'<p class="empty">No clues yet.</p>')+'</div>';
 b+='<div><h4>Timeline · Friday, October 16th</h4>'+(S.m2.done?'<ul><li>7 p.m. The exhibition starts.</li><li>8 p.m. Security check (J. Hayes). Diamond OK.</li><li><b>8:45 p.m. The camera stops working.</b></li><li>9 p.m. ALARM: the diamond is missing.</li><li>10 p.m. The exhibition ends.</li></ul>':'<p class="empty">Locked.</p>')+'</div>';
 var st=Object.keys(SUS).filter(function(k){return cnt(S.m3.asked[k])||S.m3.open===k;}).map(function(k){return '<li><b>'+SUS[k].name+':</b> '+SUS[k].stmt.join(' ')+'</li>';}).join('');
 b+='<div><h4>Statements</h4>'+(st?'<ul>'+st+'</ul>':'<p class="empty">No statements yet.</p>')+'</div>';
 var ev=S.unlocked>=4?Object.keys(EV).map(function(e){return '<li><b>'+e+' · '+EV[e].t+'</b></li>';}).join(''):'';
 ev+=EV5ORDER.filter(function(e){return S.m5.ev[e];}).map(function(e){return '<li><b>'+e+' · '+EV5[e].t+'</b></li>';}).join('');
 b+='<div><h4>Evidence</h4>'+(ev?'<ul>'+ev+'</ul>':'<p class="empty">Locked.</p>')+(S.unlocked>=4?'<p style="margin:10px 0 0"><button class="btn ghost small" data-act="map">'+I.map+' Hotel map</button></p>':'')+'</div>';
 layer('<div class="modal" data-act="closeLayer" data-self="1" style="background:rgba(5,9,16,.5)"><aside class="drawer" role="dialog" aria-label="Case file"><header><h3>Case file</h3><button class="icon-btn" data-act="closeLayer">Close</button></header><div class="body">'+b+'</div></aside></div>');}
function renderTM(){
 var el=$('#tmPanel');if(el)el.remove();if(!S.tm)return;
 var d=document.createElement('div');d.className='tm';d.id='tmPanel';
 var key=typeof S.view==='number'?S.view:S.view;
 d.innerHTML='<h5><span>Teacher mode · '+(typeof S.view==='number'?'Mission 0'+S.view:S.view==='intro'?'Intro':'Final')+'</span><button class="close" data-act="tm" aria-label="Close teacher mode">×</button></h5>'+TMN[key]+'<p style="font-size:12px;opacity:.7;margin:6px 0 0">Aparece na tela compartilhada. Prefira o Guia em janela separada (G). Atalho: T.</p>';
 document.body.appendChild(d);}

/* ---------- teacher guide ---------- */
function guideHTML(){
 var css='body{font-family:Georgia,serif;background:#f6efdc;color:#2a241b;margin:0;padding:22px;line-height:1.55;font-size:15px}h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;color:#7a1f33;border-bottom:1px solid #c9b891;padding-bottom:4px;margin:24px 0 8px;font-family:Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}h3{font-size:15px;margin:16px 0 4px;font-family:Arial,sans-serif}ul{padding-left:20px;margin:6px 0}li{margin:3px 0}i{color:#5d4f37}.tip{background:#efe2bd;border-left:4px solid #c9a24a;padding:8px 12px;margin:10px 0}small{color:#6b5a3a}';
 var m='';for(var i=1;i<=6;i++){m+='<h3>Missão 0'+i+' · '+MISSIONS[i-1]+'</h3>'+TMN[i];}
 return '<style>'+css+'</style><h1>The Missing Diamond · Guia da professora</h1><small>Aula individual online · A1 · 45–55 min · IN / ON / AT (tempo e lugar)</small>'+
 '<h2>Antes da aula</h2><h3>Objetivos</h3><ul><li>Usar IN, ON e AT em frases completas sobre lugares e horários, sem consultar regras.</li><li>Fazer perguntas simples com <i>Where…?</i> e <i>When…? / What time…?</i></li><li>Usar <i>was/were</i> com apoio, sem virar aula de passado.</li></ul>'+
 '<h3>Materiais</h3><ul><li>Este arquivo aberto no navegador, com compartilhamento de tela (compartilhe só a aba do jogo).</li><li>Este guia em janela separada, fora do compartilhamento.</li><li>Áudio do navegador ligado (botões de ouvir).</li></ul>'+
 '<h3>Preparação</h3><ul><li>Clique em <b>Restart</b> antes da aula para começar do zero.</li><li>Leia a solução abaixo uma vez.</li><li>Botões com borda tracejada e a palavra <b>teacher</b> são seus: só clique depois que a aluna falar.</li></ul>'+
 '<div class="tip"><b>Solução:</b> Jack pegou o cartão da Sophia às 8:30, desligou a câmera às 8:45 (security room), entrou na Exhibition Room às 8:50 com o cartão dela, deixou cair a chave do Locker 7 na mesa, guardou o diamante no armário dele (Locker 7, security room) e voltou para a main entrance às 9:00. Sophia mentiu sobre o restaurante porque estava numa reunião secreta (Room 12).</div>'+
 '<h3>Tempo sugerido</h3><ul><li>Intro: 3 min · M1: 8–10 · M2: 7–8 · M3: 10 · M4: 7–8 · M5: 8–10 · M6: 5–7</li></ul>'+
 '<h2>Durante a aula</h2>'+m+
 '<h3>Estratégias de correção</h3><ul><li>Não dê a resposta: pergunte <i>In, on or at?</i> e espere.</li><li>Contraste visual: <i>Inside? On top? A point?</i></li><li>Recast: ela diz “in Friday” → você responde “Yes! <b>On</b> Friday.” e segue a história.</li><li>Feedback curto e positivo: <i>Great observation! Good thinking! Look again! Check the evidence!</i></li><li>Explicação máxima de uma linha: <b>AT</b> ponto exato · <b>ON</b> superfície / dia · <b>IN</b> dentro / mês / parte do dia.</li></ul>'+
 '<h2>Depois da aula</h2><h3>Observe se a aluna consegue</h3><ul><li>Identificar IN, ON e AT em contextos familiares.</li><li>Usar as preposições em frases completas.</li><li>Formular perguntas simples.</li><li>Descrever lugares e horários.</li><li>Usar as preposições sem consultar regras.</li><li>Corrigir alguns dos próprios erros.</li></ul>'+
 '<h3>Sugestões de feedback</h3><ul><li>Cite 2 frases certas que ela disse durante o caso.</li><li>Escolha 1 padrão de erro para focar (ex.: dias com ON).</li></ul>'+
 '<h3>Reforço posterior</h3><ul><li>Próxima aula: ela descreve o próprio quarto ou mesa de trabalho (lugar) e a própria semana (tempo).</li><li>Mini-relato: “My day yesterday” com 5 horários (at…).</li><li>Revisitar o caderno IN / ON / AT da tela final no aquecimento da próxima aula.</li></ul>';}
var gWin=null;
function openGuide(){
 if(gWin&&!gWin.closed){try{gWin.focus();}catch(e){}return;}
 var w=null;try{var L=Math.max(0,(screen.availWidth||1200)-540);w=window.open('','guiaMissingDiamond','width=520,height=760,left='+L+',top=40,resizable=yes,scrollbars=yes');}catch(e){w=null;}
 if(w&&w.document){try{w.document.open();w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Guia · The Missing Diamond</title></head><body>'+guideHTML()+'</body></html>');w.document.close();gWin=w;try{window.focus();}catch(e){}return;}catch(e){}}
 layer('<div class="modal" data-act="closeLayer" data-self="1" style="background:rgba(5,9,16,.5)"><aside class="drawer" role="dialog" aria-label="Teacher guide" style="background:#f6efdc;color:#2a241b"><header style="border-color:#c9b891"><h3>Guia da professora</h3><button class="icon-btn" data-act="closeLayer" style="background:#fff;color:#2a241b">Close</button></header><div class="body"><p style="margin:0;font-size:13px;background:#7a1f33;color:#fff;padding:8px 10px;border-radius:6px">O navegador bloqueou a janela separada, então o guia abriu aqui e aparece na tela compartilhada. Para usar em janela separada, permita pop-ups.</p><div>'+guideHTML()+'</div></div></aside></div>');}

/* ---------- interactions ---------- */
function place(kind,id,target,el){
 if(kind==='m2'){
  if(S.m2.placed[target])return;
  if(CARDS[id][1]===target){S.m2.placed[target]=id;sel=null;toast('Great observation!','good');
   if(Object.keys(S.m2.placed).length===4){S.m2.done=true;unlock(3);setTimeout(function(){toast('NEW EVIDENCE UNLOCKED!','warn');},700);}render();}
  else{sel=null;toast('Check the evidence!','warn');render();var s=document.querySelector('[data-drop="m2"][data-id="'+target+'"]');if(s){s.classList.add('shake');}}
 }
 if(kind==='m4'){
  if(EV[id].who===target){S.m4.links[id]=target;sel=null;toast('Great observation!','good');render();}
  else{sel=null;toast('Look again! Read the evidence.','warn');render();var c=document.querySelector('[data-drop="m4"][data-id="'+target+'"]');if(c)c.classList.add('shake');}
 }
}
function bindDnD(){
 document.querySelectorAll('[data-pick]').forEach(function(p){p.addEventListener('dragstart',function(e){try{e.dataTransfer.setData('text/plain',p.dataset.pick+':'+p.dataset.id);}catch(x){}sel={kind:p.dataset.pick,id:p.dataset.id};});});
 document.querySelectorAll('[data-drop]').forEach(function(d){
  d.addEventListener('dragover',function(e){e.preventDefault();d.classList.add('over');});
  d.addEventListener('dragleave',function(){d.classList.remove('over');});
  d.addEventListener('drop',function(e){e.preventDefault();d.classList.remove('over');var v='';try{v=e.dataTransfer.getData('text/plain');}catch(x){}var parts=v?v.split(':'):(sel?[sel.kind,sel.id]:null);if(parts&&parts[0]===d.dataset.drop)place(parts[0],parts[1],d.dataset.id);});
 });}

document.addEventListener('click',function(e){
 var pk=e.target.closest('[data-pick]');
 if(pk&&!e.target.closest('[data-act]')){var k=pk.dataset.pick,id=pk.dataset.id;sel=(sel&&sel.id===id)?null:{kind:k,id:id};render();return;}
 var dr=e.target.closest('[data-drop]');
 if(dr&&!e.target.closest('[data-act]')){if(sel&&sel.kind===dr.dataset.drop)place(sel.kind,sel.id,dr.dataset.id);else if(!dr.classList.contains('filled'))toast(dr.dataset.drop==='m2'?'First, tap an event card.':'First, tap a piece of evidence.');return;}
 var t=e.target.closest('[data-act]');if(!t)return;
 if(t.dataset.self&&e.target!==t)return;
 var a=t.dataset.act,g=t.dataset.arg;
 switch(a){
  case 'home':go('intro');break;
  case 'start':var n=$('#detName');if(n)S.name=n.value.trim();if(S.unlocked<1)S.unlocked=1;go(S.unlocked>6?6:Math.min(S.unlocked,6));break;
  case 'go':var v=+g;if(v<=S.unlocked)go(v);break;
  case 'say':speakEn(decodeURIComponent(g));break;
  case 'casefile':caseFile();break;
  case 'restart':confirmRestart();break;
  case 'doRestart':var tm=S.tm;S=fresh();S.tm=tm;sel=null;layer('');go('intro');toast('New case. Good luck, Detective!');break;
  case 'closeLayer':layer('');break;
  case 'guide':openGuide();break;
  case 'tm':S.tm=!S.tm;track();renderTM();save();break;
  case 'map':modal('<div class="paper" style="padding:14px"><h4>Hotel map</h4>'+mapSVG()+'</div>',true);break;
  case 'keyclue':modal('<div class="paper"><span class="stamp">CLUE</span><h4>From the crime scene</h4><p class="big">The key</p><p>'+M1.key.text+'</p><p>It was on the table, in the Exhibition Room.</p></div>');break;
  // M1
  case 'm1obj':S.m1.sel=g;if(!M1[g].gate){if(!S.m1.found[g]){S.m1.found[g]=1;}}render();var cc=$('#clueCard');if(cc&&window.innerWidth<980)cc.scrollIntoView({behavior:'smooth',block:'nearest'});break;
  case 'reveal1':S.m1.found[g]=1;toast(g==='card'?'An important clue!':'Great observation!','good');if(M1MAIN.every(function(k){return S.m1.found[k];}))unlock(2);render();break;
  // M2
  case 'doc2':modal('<div class="paper" style="font-size:17px;padding:26px">'+DOCS2[g].h+'</div>');break;
  case 'q2':S.m2.qs[g]=1;render();break;
  // M3
  case 'sus':S.m3.open=S.m3.open===g?null:g;render();break;
  case 'file3':S.m3.file[g]=!S.m3.file[g];render();break;
  case 'seen3':S.m3.seen[S.m3.open][g]=1;render();break;
  case 'ans3':var sk=S.m3.open;S.m3.asked[sk][g]=1;S.m3.seen[sk][g]=1;speakEn(SUS[sk].qs[g][2]);if(Object.keys(SUS).every(m3done))unlock(4);render();break;
  // M4
  case 'ev4':e.stopPropagation();modal('<div class="paper" style="font-size:16px;padding:26px">'+EV[g].h+'</div>');break;
  case 'q4':S.m4.qs[g]=1;render();break;
  case 'liar':if(S.m4.result==='ok')break;S.m4.choice=g;S.m4.result=null;render();break;
  case 'check4':if(S.m4.choice==='sophia'){S.m4.result='ok';unlock(5);toast('Good thinking!','good');}else{S.m4.result='retry';}render();break;
  case 'retry4':S.m4.choice=null;S.m4.result=null;render();break;
  // M5
  case 'who5':S.m5.who=g;render();break;
  case 'ans5':var w=S.m5.who,q=Q5[w][g];S.m5.asked[w+g]=1;speakEn(q[1]);if(q[2]&&!S.m5.ev[q[2]]){S.m5.ev[q[2]]=1;setTimeout(function(){toast('NEW EVIDENCE UNLOCKED!','warn');},400);}render();break;
  case 'fin5':S.m5.fin[g]=1;if(QF.every(function(x,i){return S.m5.fin[i];}))unlock(6);render();break;
  // M6
  case 'who6':S.m6.who=g;S.m6.msg='';render();break;
  case 'ev6':S.m6.ev[g]=!S.m6.ev[g];S.m6.msg='';render();break;
  case 'submit6':var R=S.m6;
   if(!R.who){R.msg='Who took the diamond?|Choose a suspect first.';}
   else if(R.who!=='jack'){R.msg='Look again!|Check Evidence F and G. Where was the key from? Who was at the door at 8:50 p.m.?';}
   else if(cnt(R.ev)<2){R.msg='Check the evidence!|Choose two or more pieces of evidence.';}
   else{R.msg='';R.solved=true;R.step=1;speakEn(SOL[0][1]);}
   render();break;
  case 'solnext':S.m6.step++;speakEn(SOL[S.m6.step-1][1]);render();break;
  case 'close':S.view='closed';sel=null;render();window.scrollTo({top:0,behavior:'smooth'});speakEn('Congratulations, Detective! You solved the mystery! The diamond is safe!');break;
 }
});
document.addEventListener('input',function(e){if(e.target.id==='rWhere'){S.m6.where=e.target.value;save();}if(e.target.id==='rWhen'){S.m6.when=e.target.value;save();}if(e.target.id==='detName'){S.name=e.target.value;save();}});
document.addEventListener('keydown',function(e){
 var tag=(e.target.tagName||'').toLowerCase();
 if(e.key==='Escape'){layer('');return;}
 if((e.key==='Enter'||e.key===' ')&&(e.target.matches&&(e.target.matches('.hot')||e.target.matches('[data-pick]')))){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
 if(tag==='input'||tag==='textarea')return;
 if(e.key==='t'||e.key==='T'){S.tm=!S.tm;track();renderTM();save();}
 if(e.key==='g'||e.key==='G'){openGuide();}
});
render();
})();
</script>
