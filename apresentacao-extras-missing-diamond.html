<title>The Missing Diamond</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Courier+Prime:wght@400;700&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
/* Layout: a detective's desk at night — sticky case header with the four-stage track, one scene at a time below, documents as cream paper on deep navy */
:root{
  --navy:#0e1828; --navy2:#142238; --navy3:#1d2f4d; --line:#2b4166;
  --gold:#c9a24a; --gold2:#e8cd86; --paper:#efe5ca; --ink:#2a241b;
  --burg:#7a1f33; --burg2:#c25a72; --green:#3d9a69; --green2:#86d6a8;
  --text:#ebe5d8; --muted:#9eabc2;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --type:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--navy)}
body{color:var(--text);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--navy)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(14,24,40,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em;white-space:nowrap;background:none;border:0;cursor:pointer;padding:0}
.brand em{font-style:italic;font-weight:500;color:var(--gold2)}
.track{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;border:1px solid transparent;background:none;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.step .n{font-family:var(--type);font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line)}
.step.done{color:var(--text)} .step.done .n{background:var(--green);border-color:var(--green);color:#fff}
.step.now{color:var(--gold2);border-color:rgba(201,162,74,.5);background:rgba(201,162,74,.08)} .step.now .n{border-color:var(--gold);color:var(--gold2)}
.tools{display:flex;gap:6px;align-items:center}
.icon-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--navy2);font-size:13px;font-weight:600;cursor:pointer}
.icon-btn:hover{border-color:var(--gold)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.t{border-style:dashed;color:var(--muted);font-weight:500}
.icon-btn.t.on{color:var(--gold2);border-color:var(--gold)}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene{display:flex;flex-direction:column;gap:22px;animation:rise .45s ease both}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(30px,4.4vw,46px)}
h3{font-size:22px}
.lede{margin:6px 0 0;color:var(--muted);font-size:17px;max-width:62ch}
.head{display:flex;flex-direction:column;gap:8px}
.panel{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:#16120a;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:var(--gold2);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--gold2)}
.btn.ghost:hover{background:rgba(201,162,74,.1)}
.btn.small{padding:9px 14px;font-size:13px}
.btn svg{width:18px;height:18px}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;border:1px dashed var(--gold);background:rgba(201,162,74,.06);color:var(--gold2);font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.02em}
.tbtn:hover{background:rgba(201,162,74,.16)}
.tbtn svg{width:14px;height:14px}
.tbtn small{font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10px}
.speak{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--navy3);cursor:pointer;flex:none}
.speak:hover{border-color:var(--gold)}
.speak svg{width:16px;height:16px}

/* paper documents */
.paper{background:var(--paper);color:var(--ink);font-family:var(--type);font-size:15px;line-height:1.5;padding:20px 20px 18px;border-radius:3px;box-shadow:0 12px 28px rgba(0,0,0,.4);position:relative}
.paper h4{font-family:var(--body);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 10px;color:#6b5a3a}
.paper .big{font-family:var(--display);font-size:22px;font-weight:700;margin:0 0 8px;color:var(--ink)}
.stamp{position:absolute;top:12px;right:14px;border:2px solid var(--burg);color:var(--burg);font:700 10px/1 var(--body);letter-spacing:.16em;padding:4px 7px;transform:rotate(7deg);border-radius:2px;opacity:.85}
.paper table{border-collapse:collapse;width:100%;font-size:14px}
.paper td{border-bottom:1px dashed #b9a77d;padding:5px 4px;vertical-align:top}
.cal{width:100%;font-family:var(--body);text-align:center;font-size:13px}
.cal th{font-size:10px;letter-spacing:.1em;color:#7a6338;padding:3px}
.cal td{border:0;padding:4px 0}
.cal td.hl{background:var(--burg);color:#fff;border-radius:50%;font-weight:700}
.cal button{all:unset;cursor:pointer;display:block;width:100%;height:100%;border-radius:50%}

/* intro */
.intro{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center}
.intro .art{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.45)}
.intro .art svg{display:block;width:100%;height:auto}
.intro h1{font-size:clamp(40px,6vw,72px);letter-spacing:-.01em}
.intro h1 em{display:block;font-style:italic;font-weight:500;color:var(--gold2);font-size:.5em;letter-spacing:.02em;margin-top:6px}
.welcome{font-family:var(--type);font-size:17px;line-height:1.7;background:var(--paper);color:var(--ink);padding:22px 24px;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.4);position:relative}
.welcome p{margin:0 0 4px}
.welcome .lab{font-family:var(--body);font-weight:700;letter-spacing:.2em;font-size:11px;color:var(--burg);margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input{background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);font:500 16px var(--body);width:100%}
.field input:focus{border-color:var(--gold);outline:none}

/* explore (stage 1) */
.explore{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.room-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b1322;position:relative}
.room{display:block;width:100%;height:auto}
.hot{cursor:pointer;transition:filter .2s}
.hot:hover,.hot:focus{filter:drop-shadow(0 0 7px rgba(232,205,134,.95));outline:none}
.hot.sel{filter:drop-shadow(0 0 10px rgba(232,205,134,1))}
.room-tip{position:absolute;left:12px;bottom:10px;background:rgba(14,24,40,.85);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.clue-card{min-height:230px;display:flex;flex-direction:column;gap:14px}
.qbig{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.18;color:var(--gold2)}
.answer{display:flex;align-items:center;gap:10px;background:rgba(61,154,105,.14);border:1px solid rgba(61,154,105,.5);border-radius:10px;padding:10px 12px;font-weight:600;color:var(--green2)}
.bonus{font-size:14px;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px;margin-top:4px}
.checklist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.checklist li .b{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.checklist li.ok{color:var(--text)} .checklist li.ok .b{background:var(--green);border-color:var(--green)}
.checklist li .b svg{width:12px;height:12px}
.meter{height:6px;background:var(--navy);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
.banner{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;background:linear-gradient(120deg,rgba(61,154,105,.22),rgba(61,154,105,.06));border:1px solid rgba(61,154,105,.55);border-radius:14px;padding:18px 20px;animation:pop .45s ease both}
.banner strong{font-family:var(--display);font-size:24px;display:block}
.tip{font-size:13.5px;color:var(--muted);background:var(--navy3);border-radius:10px;padding:10px 14px;border:1px dashed var(--line)}

/* schedule (stage 2) */
.sched-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);gap:16px}
.clockbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px}
.clockbox svg{width:96px;height:96px}
.evcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.evbtn{all:unset;cursor:pointer;display:block}
.evbtn .paper{min-height:96px;transition:transform .2s}
.evbtn:hover .paper,.evbtn:focus-visible .paper{transform:translateY(-3px)}
.evbtn.on .paper{box-shadow:0 0 0 2px var(--gold),0 12px 28px rgba(0,0,0,.4)}

/* interrogation (stage 3) */
.iroom{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse 60% 70% at 50% -10%,rgba(232,205,134,.22),rgba(232,205,134,0) 60%),linear-gradient(#111b2c,#0a1220);padding:22px}
.lamp{position:absolute;top:0;left:50%;width:120px;height:26px;transform:translateX(-50%);background:#2a2f3a;border-radius:0 0 60px 60px;box-shadow:0 10px 40px rgba(232,205,134,.35)}
.ipick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 18px}
.ipick button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(20,34,56,.9);font-weight:700}
.ipick button svg{width:36px;height:42px;border-radius:50%}
.ipick button.on{border-color:var(--gold2);color:var(--gold2)}
.ipick .tag{align-self:flex-start;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:var(--navy3);color:var(--muted)}
.istage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
.istage .pic svg{display:block;width:100%;height:auto;border-radius:10px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.charcard{background:var(--navy3);border:1px solid var(--line);border-radius:12px;padding:16px}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0}
.info-row{display:flex;align-items:flex-start;gap:8px;font-size:15px}
.info-row .ic{font-size:18px;line-height:1.3;flex:none}
.info-row .lab{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.info-row .val{font-weight:700;color:var(--text)}
.obj-art{margin-top:14px;display:flex;align-items:center;gap:14px;background:var(--navy);border-radius:10px;padding:10px 12px}
.obj-art svg{width:72px;height:60px;flex:none}
.qrow{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.qrow:first-child{border-top:0;padding-top:0}
.qrow .qtext{font-family:var(--display);font-size:19px;color:var(--gold2)}
.hintline{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.hintline .lvl{font-family:var(--type);font-size:14px;color:var(--text)}
.hintline .lvl.teacher{color:var(--burg2)}
.surprise{margin-top:10px;background:rgba(201,162,74,.08);border:1px dashed var(--gold);border-radius:12px;padding:14px}
.surprise .qtext{font-family:var(--display);font-size:20px;color:var(--gold2)}
.typeb{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ffd9e1;background:rgba(122,31,51,.4);border-radius:999px;padding:4px 10px;margin-bottom:6px}
.suspass{align-self:flex-start;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:var(--navy3);color:var(--muted)}
.suspass.ok{background:rgba(61,154,105,.2);color:var(--green2)}

/* find the diamond (stage 4) */
.loc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.loc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 14px;border-radius:14px;border:1px solid var(--line);background:var(--navy2);text-align:center;transition:border-color .2s,transform .2s}
.loc:hover,.loc:focus-visible{border-color:var(--gold);transform:translateY(-2px)}
.loc .em{font-size:38px}
.loc b{font-family:var(--display);font-size:19px}
.recap{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:14.5px;color:var(--muted)}
.recap li{display:flex;gap:8px}

/* closed */
.closed{text-align:center;align-items:center}
.closed h1{font-size:clamp(46px,8vw,92px);letter-spacing:.02em}
.closed .bigstamp{display:inline-block;border:4px solid var(--burg2);color:var(--burg2);font:700 clamp(28px,5vw,48px)/1 var(--display);letter-spacing:.08em;padding:10px 22px;transform:rotate(-6deg);animation:stamp .6s cubic-bezier(.2,1.6,.4,1) .2s both}
.gem{width:min(220px,60vw);animation:float 4s ease-in-out infinite}
.gem-wrap{position:relative;display:grid;place-items:center}
.spark{position:absolute;width:8px;height:8px;background:var(--gold2);transform:rotate(45deg);animation:twinkle 1.8s ease-in-out infinite}
.notebook{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;text-align:left}
.notebook .paper ul{margin:0;padding-left:18px}
.notebook .paper .p{font-family:var(--display);font-size:40px;font-weight:700;color:var(--burg);line-height:1}
.stats{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:40px;color:var(--gold2);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* help */
details.help{background:var(--navy2);border:1px solid var(--line);border-radius:12px}
details.help summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details.help summary::-webkit-details-marker{display:none}
details.help[open] summary{color:var(--gold2)}
.frames{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
.frames span{font-family:var(--type);background:var(--navy3);border-radius:7px;padding:6px 10px;font-size:15px}

/* overlays */
.modal{position:fixed;inset:0;z-index:90;background:rgba(5,9,16,.78);display:grid;place-items:center;padding:20px}
.modal-card{max-width:560px;width:100%;max-height:86vh;overflow:auto;animation:pop .3s ease both}
.x-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid #b9a77d;background:#f8f2e2;color:var(--ink);cursor:pointer;font-size:18px;line-height:1;z-index:2}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:85;background:var(--navy2);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:slide .3s ease both}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:1px solid var(--line)}
.drawer .body{overflow:auto;padding:18px 18px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.tm{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:80;width:min(400px,calc(100% - 28px));max-height:55vh;overflow:auto;background:#1a1408;border:1px dashed var(--gold);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5;color:#f1e4c2;box-shadow:0 20px 40px rgba(0,0,0,.5);animation:rise .3s ease both}
.tm h5{margin:0 0 8px;font:700 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);display:flex;justify-content:space-between;gap:8px}
.tm ul{margin:4px 0 8px;padding-left:18px}
.tm b{color:var(--gold2)}
.tm .close{background:none;border:0;color:var(--gold2);cursor:pointer;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:95;background:var(--navy3);border:1px solid var(--gold);padding:11px 18px;border-radius:999px;font-weight:700;letter-spacing:.02em;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:var(--green);color:var(--green2)}
.toast.warn{border-color:var(--burg2);color:#ffd2dc}
.shake{animation:shake .4s ease}

@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.001;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes twinkle{0%,100%{opacity:0;transform:rotate(45deg) scale(.3)}50%{opacity:1;transform:rotate(45deg) scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:980px){
  .intro,.explore,.sched-top,.istage{grid-template-columns:1fr}
  .evcards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:700px){
  .loc-grid,.notebook,.info-grid{grid-template-columns:1fr}
  .istage .pic{max-width:180px}
  .brand span.full{display:none}
  .icon-btn .lbl{display:none}
}
@media (max-width:440px){.evcards{grid-template-columns:1fr}}
</style>

<header class="top">
  <div class="top-in">
    <a class="icon-btn" href="material-de-aula.html" aria-label="Sair" title="Voltar para Material de Aula">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </a>
    <button class="brand" data-act="home" aria-label="Back to the start">
      <svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><polygon points="8,14 14,6 26,6 32,14 20,34" fill="#c9a24a"/><polygon points="8,14 32,14 20,34" fill="#e8cd86"/><polyline points="14,6 17,14 20,34 23,14 26,6" fill="none" stroke="#0e1828" stroke-width="1.2"/></svg>
      <span>The Missing <em>Diamond</em></span>
    </button>

/* ---------- rendering ---------- */
function track(){
 var h='';for(var i=1;i<=4;i++){var cur=S.view===i,done=stageDone(i);
  h+='<button class="step'+(done?' done':'')+(cur?' now':'')+'" data-act="go" data-arg="'+i+'"><span class="n">'+(done?'✓':i)+'</span>'+STAGES[i-1]+'</button>';}
 $('#track').innerHTML=h;
 var a=$('#track .now');if(a&&a.scrollIntoView)try{a.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
 $('#tmBtn').classList.toggle('on',!!S.tm);
}
function stageDone(i){
 if(i===1)return M1ORDER.every(function(k){return S.s1.found[k];});
 if(i===2)return S.s2.found.month&&S.s2.found.day&&M2EV.every(function(x){return S.s2.found[x.id];});
 if(i===3)return Object.keys(SUS).every(function(k){return S.s3.interviewed[k];});
 if(i===4)return S.s4.solved;
}
function head(n,place,title,lede){return '<div class="head"><p class="eyebrow">Stage 0'+n+' · '+place+'</p><h2>'+title+'</h2><p class="lede">'+lede+'</p></div>';}
function nextBtn(n,label){return '<button class="btn" data-act="go" data-arg="'+n+'">'+(label||'Continue investigation')+' '+I.arrow+'</button>';}

 '<div class="welcome"><span class="stamp">CASE FILE</span><p class="lab">WELCOME, DETECTIVE! 🔎</p><p>A diamond is missing at the Royal Hotel!</p><p>Three people are at the hotel.</p><p>Where is the diamond?</p><p><b>Let’s investigate!</b></p></div>'+
 '<div class="row" style="align-items:flex-end"><div class="field" style="flex:1 1 200px"><label for="detName">Detective name</label><input id="detName" type="text" maxlength="30" placeholder="Your name" value="'+(S.name||'').replace(/"/g,'&quot;')+'"></div>'+

 else if(!f[id]){card='<p class="eyebrow">Detective question</p><p class="qbig">'+o.q+'</p><div class="row">'+spk(o.q)+'<span style="color:var(--muted);font-size:14px">Answer first. Then the clue opens.</span></div><div class="row">'+tb('reveal1',id,'Reveal')+'</div>';}
 else{card='<div class="paper"><h4>'+o.title+'</h4><p style="margin:0;font-size:16px">'+o.icon+' Found!</p></div><div class="answer">'+spk(o.a)+o.a+'</div>'+(o.bonusQ?'<div class="bonus"><b>Extra:</b> '+o.bonusQ+(f.phoneBonus?'<br>'+spk(o.bonusA)+o.bonusA:'<br>'+tb('reveal1bonus',id,'Reveal'))+'</div>':'');}
 var found=cnt(f)-((f.phoneBonus)?1:0),list=M1ORDER.map(function(k){return '<li class="'+(f[k]?'ok':'')+'"><span class="b">'+(f[k]?I.check:'')+'</span>'+M1[k].icon+' '+M1[k].label+'</li>';}).join('');
 var done=stageDone(1);

 '<div class="explore"><div class="room-wrap">'+roomSVG()+'<span class="room-tip">Objects found: '+found+' / 6</span></div>'+
 '<aside class="panel clue-card" id="clueCard">'+card+'<div style="margin-top:auto;display:flex;flex-direction:column;gap:10px"><p class="eyebrow" style="margin:0">Checklist</p><ul class="checklist">'+list+'</ul><div class="meter"><i style="width:'+(found/6*100)+'%"></i></div></div></aside></div>'+
 help(['It’s in the…','It’s on the…','It’s at the…'])+
 (done?'<div class="tip">💡 The detective is <b>in</b> the hotel (inside the building) and the hotel is <b>at</b> 1 Park Road (the address). Both are correct!</div><div class="banner"><div><strong>Great observation, Detective!</strong>Now let’s check the schedule for Friday night.</div>'+nextBtn(2)+'</div>':'')+
 '</section>';}

 var info=s.info.map(function(r){return '<div class="info-row"><span class="ic">'+r[0]+'</span><span><span class="lab">'+r[1]+'</span><span class="val">'+r[2]+'</span></span></div>';}).join('');
 var qrows=s.qs.map(function(q,i){
  var key=qKey(w,i),lvl=S.s3.hint[key]||0;
  var hintLine='';
  if(lvl>=3)hintLine='<span class="lvl teacher">👁️ Teacher only: "'+q.a+'"</span>';
  else if(lvl>=2)hintLine='<span class="lvl">💬 "'+q.starter+'"</span>';
  else if(lvl>=1)hintLine='<span class="lvl">👀 Look at the picture again.</span>';
  return '<div class="qrow"><span class="qtext">'+q.q+'</span><div class="hintline">'+spk(q.q)+(lvl<3?'<button class="tbtn" data-act="s3hint" data-arg="'+key+'">'+I.bulb+'<span>Need a hint?</span></button>':'')+hintLine+'</div></div>';
 }).join('');
 var surp=S.s3.surprise[w];
 var surpHtml='';

  surpHtml='<div class="surprise">'+(surp.type==='B'?'<span class="typeb">✨ Use your imagination!</span>':'')+'<p class="qtext">'+surp.q+'</p>'+spk(surp.q)+
   (surp.type==='A'?('<div style="margin-top:8px">'+(S.s3.surpriseRevealed[w]?'<span class="lvl teacher">👁️ Teacher only: "'+surp.a+'"</span>':'<button class="tbtn" data-act="s3surpreveal">'+I.key+'<span>Show expected answer</span><small>teacher</small></button>')+'</div>'):'')+'</div>';
 }
 return '<section class="scene">'+head(3,'The interrogation room','Meet the Suspects','You are the detective. The student plays each suspect and answers in the first person!')+

 '<div class="charcard"><p class="eyebrow" style="margin:0 0 4px">'+s.job+'</p><h3 style="font-size:28px;margin-bottom:10px">'+s.name+'</h3>'+

 surpHtml+help(['My keys are…','My phone is…','My bag is…','My birthday is…','I work…','I’m…'])+
 (stageDone(3)?'<div class="banner"><div><strong>Case almost closed!</strong>You talked to everyone. Now let’s find the diamond.</div>'+nextBtn(4)+'</div>':'')+'</section>';}

 '<div class="paper"><p class="p">ON</p><ul><li>on the table</li><li>on the chair</li><li>on the wall</li><li>on Friday</li></ul></div>'+
 '<div class="paper"><p class="p">AT</p><ul><li>at 8 p.m.</li><li>at night</li><li>at the door</li><li>at the reception</li></ul></div></div></div>'+
 '<div class="row" style="justify-content:center"><button class="btn ghost" data-act="go" data-arg="1">Review the case</button><button class="btn" data-act="restart">New investigation</button></div></section>';}

function render(){
 track();
 var v=S.view,h=v==='intro'?vIntro():v===1?vS1():v===2?vS2():v===3?vS3():v===4?vS4():vClosed();
 $('#stage').innerHTML=h;
 renderTM();save();
}
function go(v){S.view=v;render();window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- overlays ---------- */
function layer(h){$('#layer').innerHTML=h;}
function toast(m,t){var el=$('#toast');el.textContent=m;el.className='toast show '+(t||'');clearTimeout(toast._t);toast._t=setTimeout(function(){el.className='toast';},2200);}
function confirmRestart(){layer('<div class="modal" data-act="closeLayer" data-self="1"><div class="modal-card" style="position:relative"><button class="x-btn" data-act="closeLayer" aria-label="Close">×</button><div class="paper" style="padding:26px"><span class="stamp">NEW CASE</span><p class="big">Start a new investigation?</p><p>All progress will be deleted.</p><div class="row" style="margin-top:14px"><button class="btn" data-act="doRestart">Yes, restart</button><button class="btn ghost" data-act="closeLayer" style="color:#7a1f33;border-color:#7a1f33">Cancel</button></div></div></div></div>');}
function renderTM(){
 var el=$('#tmPanel');if(el)el.remove();if(!S.tm)return;
 var d=document.createElement('div');d.className='tm';d.id='tmPanel';
 var key=typeof S.view==='number'?S.view:S.view;
 d.innerHTML='<h5><span>Teacher mode · '+(typeof S.view==='number'?'Stage 0'+S.view:S.view==='intro'?'Intro':'Final')+'</span><button class="close" data-act="tm" aria-label="Close teacher mode">×</button></h5>'+TMN[key]+'<p style="font-size:12px;opacity:.7;margin:6px 0 0">Aparece na tela compartilhada. Prefira o Guia em janela separada (G). Atalho: T.</p>';
 document.body.appendChild(d);}

/* ---------- teacher guide ---------- */
function guideHTML(){
 var css='body{font-family:Georgia,serif;background:#f6efdc;color:#2a241b;margin:0;padding:22px;line-height:1.55;font-size:15px}h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;color:#7a1f33;border-bottom:1px solid #c9b891;padding-bottom:4px;margin:24px 0 8px;font-family:Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}h3{font-size:15px;margin:16px 0 4px;font-family:Arial,sans-serif}ul{padding-left:20px;margin:6px 0}li{margin:3px 0}i{color:#5d4f37}.tip{background:#efe2bd;border-left:4px solid #c9a24a;padding:8px 12px;margin:10px 0}small{color:#6b5a3a}.dlg{background:#fff;border:1px solid #c9b891;border-radius:6px;padding:10px 12px;margin:8px 0;font-size:14px}';
 return '<style>'+css+'</style><h1>The Missing Diamond · Guia da professora</h1><small>Aula individual online · A1 · 45–50 min · IN / ON / AT (tempo e lugar) · Foco: Speaking</small>'+
 '<div class="tip"><b>Princípio central:</b> o mistério é o pano de fundo; a produção oral com IN, ON e AT é o verdadeiro objetivo. Evite deixar a investigação ocupar mais espaço do que a fala da aluna.</div>'+
 '<h2>Visão geral</h2><table style="width:100%;border-collapse:collapse"><tr><td style="padding:4px 6px"><b>1 · Explore the Hotel</b></td><td>IN/ON/AT — lugar</td><td>~10 min</td></tr><tr><td style="padding:4px 6px"><b>2 · Check the Schedule</b></td><td>IN/ON/AT — tempo</td><td>~10 min</td></tr><tr><td style="padding:4px 6px"><b>3 · The Interrogation Room</b></td><td>IN/ON/AT — speaking</td><td>~20 min</td></tr><tr><td style="padding:4px 6px"><b>4 · Find the Diamond</b></td><td>Prática integrada</td><td>~10 min</td></tr></table>'+
 '<h2>Preparação</h2><ul><li>Compartilhe só a aba do jogo; mantenha este guia em janela separada.</li><li>Clique em <b>Restart</b> antes da aula para começar do zero.</li><li>O diamante está na <b>Reception</b>, dentro de uma caixa — não há culpado para descobrir.</li></ul>'+
 '<h2>Estágio 1 · Explore the Hotel</h2><h3>Objective</h3><ul><li>Praticar IN, ON e AT para lugares e posições, em frases completas.</li></ul>'+
 '<h3>Instructions</h3><ul><li>A aluna clica num objeto; ela responde a pergunta <b>antes</b> de você clicar em Reveal.</li><li>Não mostre a frase certa antes da resposta dela.</li></ul>'+
 '<h3>Suggested Questions</h3><ul><li>Where is the key? / the phone? / the note? / the picture? / the book? / the security guard?</li></ul>'+
 '<h3>Expected Answers</h3><ul><li>The key is on the table. · The phone is in the bag. (extra: The bag is on the floor.) · The note is in the drawer. · The picture is on the wall. · The book is on the chair. · The security guard is at the door.</li></ul>'+
 '<h3>Common Mistakes</h3><ul><li>"in the table", "on the bag" — troque <i>inside / on top / a point?</i></li></ul>'+
 '<h3>Feedback Strategies</h3><ul><li>Recast curto: ela diz "in the table" → "Almost! <b>On</b> the table." e siga.</li></ul>'+
 '<h2>Estágio 2 · Check the Schedule</h2><h3>Objective</h3><ul><li>Praticar IN, ON e AT para tempo (mês, dia, data, hora).</li></ul>'+
 '<h3>Instructions</h3><ul><li>Clique no calendário (mês, dia 16) e nos 3 cartões de evento; pergunta antes do Reveal, como no Estágio 1.</li></ul>'+
 '<h3>Suggested Questions</h3><ul><li>What month is the event? What day? What time does it start? What time is the security check? What time does the diamond disappear? Morning or night?</li></ul>'+
 '<h3>Expected Answers</h3><ul><li>In October. · On Friday, on the 16th. · At 8 p.m. · At 8:30 p.m. · At 9 p.m. · At night.</li></ul>'+
 '<h3>Common Mistakes</h3><ul><li>"in Friday", "in 9 p.m." — dica de 1 linha: <b>AT</b> hora exata · <b>ON</b> dia/data · <b>IN</b> mês/parte do dia.</li></ul>'+
 '<h3>Feedback Strategies</h3><ul><li>Peça para ela repetir a frase certa em voz alta depois da correção.</li></ul>'+
 '<h2>Estágio 3 · The Interrogation Room (mudança principal)</h2><h3>Objective</h3><ul><li>Produção oral independente: a aluna interpreta o suspeito e constrói a própria frase, sem ler nenhuma pronta.</li></ul>'+
 '<h3>Instructions</h3><ul><li>A aluna escolhe um suspeito. O cartão mostra só palavras-chave e ícones — nunca frases nem preposições.</li><li>Você faz as perguntas sugeridas, uma a uma, em voz alta. Ela responde na primeira pessoa.</li><li>Use <b>Surprise question</b> de vez em quando (tipo A = informação do cartão; tipo B = resposta inventada, marcada "USE YOUR IMAGINATION!").</li><li>Clique em <b>Finish interrogation</b> quando achar suficiente — não há nota automática.</li></ul>'+
 '<h3>Suggested Questions &amp; Expected Answers</h3>'+
 Object.keys(SUS).map(function(k){var s=SUS[k];return '<h3>'+s.name+' · '+s.job+'</h3><ul>'+s.qs.map(function(q){return '<li>'+q.q+' → <i>'+q.a+'</i></li>';}).join('')+'<li>(extra) '+s.extraA.q+' → <i>'+s.extraA.a+'</i></li></ul>';}).join('')+
 '<h3>Common Mistakes</h3><ul><li>"Where you work?" em vez de "Where <b>do</b> you work?" — modele a forma certa, sem virar aula de estrutura de pergunta.</li><li>Confundir <b>in</b> my pocket / <b>on</b> the desk / <b>on</b> the chair.</li></ul>'+
 '<h3>Feedback Strategies — correção por autocorreção</h3><div class="dlg"><b>Student:</b> "My birthday is on November."<br><b>Teacher:</b> "November… Is it a day or a month?"<br><b>Student:</b> "A month!"<br><b>Teacher:</b> "So…?"<br><b>Student:</b> "My birthday is in November!"</div><p>Evite interromper demais; anote 1 ou 2 erros recorrentes e retome no fechamento.</p>'+
 '<h3>Hint System</h3><ul><li><b>Hint 1 — Visual:</b> aparece um lembrete neutro ("Look at the picture again"), sem revelar a preposição.</li><li><b>Hint 2 — Structure:</b> mostra só o início da frase (ex.: "My phone is…").</li><li><b>Hint 3 — Teacher Support:</b> mostra a resposta completa só para você conferir; não leia a frase pronta para a aluna — use perguntas-ponte.</li></ul>'+
 '<h2>Estágio 4 · Find the Diamond</h2><h3>Objective</h3><ul><li>Consolidar IN, ON e AT numa atividade final rápida e sem pressão.</li></ul>'+
 '<h3>Instructions</h3><ul><li>Pergunte em voz alta usando o que já foi praticado antes dela escolher um local.</li><li>Erro na escolha: sem penalidade, ela tenta de novo.</li></ul>'+
 '<h3>Expected Answers</h3><ul><li>The diamond is at the reception, in a box.</li></ul>'+
 '<h2>Depois da aula</h2><ul><li>Observe se ela já formula frases com IN/ON/AT sem procurar uma regra.</li><li>Cite 2 frases certas que ela disse durante o caso.</li><li>Escolha 1 padrão de erro para reforçar na próxima aula (ex.: dias com ON).</li><li>Sugestão de reforço: ela descreve a própria mesa de trabalho (lugar) e a própria semana (tempo).</li></ul>';}
var gWin=null;
function openGuide(){
 if(gWin&&!gWin.closed){try{gWin.focus();}catch(e){}return;}
 var w=null;try{var L=Math.max(0,(screen.availWidth||1200)-540);w=window.open('','guiaMissingDiamond','width=520,height=760,left='+L+',top=40,resizable=yes,scrollbars=yes');}catch(e){w=null;}
 if(w&&w.document){try{w.document.open();w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Guia · The Missing Diamond</title></head><body>'+guideHTML()+'</body></html>');w.document.close();gWin=w;try{window.focus();}catch(e){}return;}catch(e){}}
 layer('<div class="modal" data-act="closeLayer" data-self="1" style="background:rgba(5,9,16,.5)"><aside class="drawer" role="dialog" aria-label="Teacher guide" style="background:#f6efdc;color:#2a241b"><header style="border-color:#c9b891"><h3>Guia da professora</h3><button class="icon-btn" data-act="closeLayer" style="background:#fff;color:#2a241b">Close</button></header><div class="body"><p style="margin:0;font-size:13px;background:#7a1f33;color:#fff;padding:8px 10px;border-radius:6px">O navegador bloqueou a janela separada, então o guia abriu aqui e aparece na tela compartilhada. Para usar em janela separada, permita pop-ups.</p><div>'+guideHTML()+'</div></div></aside></div>');}

/* ---------- interactions ---------- */
function pickSurprise(w){
 var s=SUS[w],pool=[];
 s.qs.forEach(function(q){pool.push({type:'A',q:q.q,a:q.a});});
 pool.push({type:'A',q:s.extraA.q,a:s.extraA.a});
 s.typeB.forEach(function(q){pool.push({type:'B',q:q});});
 var prev=S.s3.surprise[w],next;
 do{next=pool[Math.floor(Math.random()*pool.length)];}while(pool.length>1&&prev&&next.q===prev.q);
 return next;
}

document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;
 if(t.dataset.self&&e.target!==t)return;
 var a=t.dataset.act,g=t.dataset.arg;
 switch(a){
  case 'home':go('intro');break;
  case 'start':var n=$('#detName');if(n)S.name=n.value.trim();go(1);break;
  case 'go':go(+g===+g?+g:g);break;
  case 'say':speakEn(decodeURIComponent(g));break;
  case 'restart':confirmRestart();break;
  case 'doRestart':var tm=S.tm;S=fresh();S.tm=tm;layer('');go('intro');toast('New case. Good luck, Detective!');break;
  case 'closeLayer':layer('');break;
  case 'guide':openGuide();break;
  case 'tm':S.tm=!S.tm;track();renderTM();save();break;
  // Stage 1
  case 's1obj':S.s1.sel=g;render();var cc=$('#clueCard');if(cc&&window.innerWidth<980)cc.scrollIntoView({behavior:'smooth',block:'nearest'});break;
  case 'reveal1':S.s1.found[g]=1;toast('Great observation!','good');render();break;
  case 'reveal1bonus':S.s1.found.phoneBonus=1;render();break;
  // Stage 2
  case 's2ask':S.s2.sel=g;render();break;
  case 'reveal2':S.s2.found[g]=1;toast('Great observation!','good');render();break;
  case 'reveal2bonus':S.s2.found.night=1;render();break;
  // Stage 3
  case 's3pick':S.s3.open=g;render();break;
  case 's3hint':var cur=S.s3.hint[g]||0;S.s3.hint[g]=Math.min(3,cur+1);render();break;
  case 's3surprise':S.s3.surprise[S.s3.open]=pickSurprise(S.s3.open);S.s3.surpriseRevealed[S.s3.open]=false;render();break;
  case 's3surpreveal':S.s3.surpriseRevealed[S.s3.open]=true;render();break;
  case 's3finish':S.s3.interviewed[S.s3.open]=1;toast('Interrogation complete!','good');render();break;
  // Stage 4
  case 's4pick':S.s4.picked=g;if(g===DIAMOND_LOC){S.s4.solved=true;speakEn('You found it, Detective! The diamond was inside a box, at the reception.');}else{toast('Look again, Detective!','warn');}render();break;
  case 'close':S.view='closed';render();window.scrollTo({top:0,behavior:'smooth'});speakEn('Congratulations, Detective! You found the diamond!');break;
 }
});
document.addEventListener('input',function(e){if(e.target.id==='detName'){S.name=e.target.value;save();}});
document.addEventListener('keydown',function(e){
 var tag=(e.target.tagName||'').toLowerCase();
 if(e.key==='Escape'){layer('');return;}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.hot')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
 if(tag==='input'||tag==='textarea')return;
 if(e.key==='t'||e.key==='T'){S.tm=!S.tm;track();renderTM();save();}
 if(e.key==='g'||e.key==='G'){openGuide();}
});

render();
})();
</script>
